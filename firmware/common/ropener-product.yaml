# =============================================================================
# Ropener — product layer (curtain opener)
# =============================================================================
# The Ropener-specific behaviour that sits ON TOP of the shared valar-core +
# scheduling packages. Each board wrapper (firmware/VAL3000, firmware/VAL3100)
# includes:
#
#   packages:
#     valar_core: { url: .../valar-motion, files: [common/valar-core.yaml], ... }
#     scheduling: { url: .../valar-motion, files: [common/scheduling.yaml], ... }
#     product:    !include ../common/ropener-product.yaml
#
# This layer owns: the cover, sensorless homing, the two-button gesture UI, the
# gear/distance math, and the schedule_open/schedule_close scripts the shared
# scheduling mixin calls. It reuses core's driver (id: driver), tuning entities,
# diagnostics, and web UI groups, and renames a few core entities via !extend so
# field units keep their existing Home Assistant entity_ids.
# =============================================================================

# Mechanical + gesture constants (compile-time; a new flash to change).
substitutions:
  gear_distance_cm: "3.7699"       # MK7 drive gear: cm of rope per revolution
  steps_per_revolution: "1600"     # 200 full steps * 8 microsteps
  hold_run_ms: "700"               # press longer than this = hold-to-run
  tap_window_ms: "400"             # rapid-tap chaining window
  combo_home_ms: "3000"            # both buttons held this long = set home
  home_speed: "3000"               # homing runs at this fixed speed (above the
                                   # ~2000 drivetrain resonance; gentle into the
                                   # stop; ~14 s for a full 1 m travel)
  home_timeout_s: "60"             # homing auto-aborts after this if not stopped
                                   # -- backstops an accidental press and a
                                   # mis-tuned StallGuard that never fires

# Product boot steps. Core (priority 600) has already configured the TMC2209 and
# stepper; here we resync the derived step count and restore the saved position
# so the cover comes up accurate without a re-home. (scheduling re-applies
# tz/location at priority -100, after this.)
# The API's reboot_timeout defaults to 15 min: if no *API* client connects in
# that window the device reboots. It counts native-API clients only — a browser
# on the web UI is not one. The Ropener is sold as working without Home
# Assistant, so a customer driving it purely from the browser got a controller
# that rebooted every 15 minutes, stopping the curtain mid-travel if it happened
# to be moving. 0 = never reboot for lack of a client.
#
# Trade-off: this also removes the watchdog that recovers a wedged API
# connection. Acceptable here — the users it was rebooting are the ones not
# using the API at all — and safe_mode still covers boot loops.
api:
  reboot_timeout: 0s

# Optional MQTT, for home automation without Home Assistant. Compiled in but
# OFF: the broker is a placeholder, and the real address / port / credentials
# are typed on the config page (MQTT group) and applied at runtime by
# mqtt_apply. Discovery is off -- Home Assistant users already have the native
# API, and discovery would duplicate every entity there. Topics default to the
# device name with its MAC suffix (e.g. ropener-eec3f4/...), so several units
# can share one broker -- but ESPHome bakes the status (online/offline) and
# debug topics at compile time WITHOUT the suffix, so mqtt_apply rebuilds those
# from the runtime prefix. reboot_timeout 0: ESPHome's default reboots the
# device after 15 min without a broker, which with a wrong address typed in
# would restart the curtain mid-travel (same reason as api: above).
mqtt:
  id: mqtt_client
  broker: "0.0.0.0"
  enable_on_boot: false
  discovery: false
  reboot_timeout: 0s

esphome:
  on_boot:
    - priority: 400.0
      then:
        - script.execute: recompute_distance
        - script.execute: recompute_tcoolthrs
        - stepper.report_position:
            id: driver
            position: !lambda "return id(global_current_position);"
        - stepper.set_target:
            id: driver
            target: !lambda "return id(global_current_position);"
    # Last, once everything is set up and restored:
    - priority: -100.0
      then:
        # First (and, until something changes, only) publish of the entities that
        # don't poll (update_interval: never) -- they publish on change instead of
        # republishing the same value every second, which over MQTT was ~1/s per
        # entity while idle.
        - component.update: sel_speed
        - component.update: sel_btn_swap
        - component.update: num_motor_current
        - component.update: num_centimeters
        - component.update: num_overtravel
        - component.update: mqtt_password
        # MQTT: every MQTT setting has been restored by now (their on_value /
        # on_turn_on fire during restore and are ignored until mqtt_boot_done).
        - globals.set: { id: mqtt_boot_done, value: 'true' }
        - script.execute: mqtt_apply

# --- Product state (tuning/direction globals come from core; sun globals from
#     the scheduling mixin) -----------------------------------------------------
globals:
  - { id: global_distance_cm,      type: int, restore_value: yes, initial_value: '30' }
  - { id: global_distance_steps,   type: int, restore_value: no,  initial_value: '12732' }
  - { id: global_state,            type: int, restore_value: no,  initial_value: '0' }
  - { id: global_current_position, type: int, restore_value: yes, initial_value: '0' }
  # Close overtravel: a full close drives this far PAST 0, then re-zeroes there.
  # The drive is open-loop, so travel lost to rope slip or skipped steps on each
  # close otherwise accumulates into a growing gap; overtravel recovers it every
  # cycle. Default 0 = off (identical to pre-overtravel firmware). Only useful
  # where the curtain closes against something solid -- without a stop, each
  # close walks home further closed until it reaches one.
  - { id: global_overtravel_cm,    type: float, restore_value: yes, initial_value: '0' }
  - { id: global_overtravel_steps, type: int,   restore_value: no,  initial_value: '0' }
  # Shipped run current. Core defaults IRUN to 25 (~1.56 A), which overheats the
  # TMC2209 on long or heavy runs: it switches the motor off until it cools while
  # the step count keeps running, so the curtain silently loses position (field
  # report: 190 cm, 4 grommet panels; IRUN 30 cut out every other second). 20 is
  # ~1.26 A -- about 35% less heat for ~80% of the torque. Only units that never
  # changed IRUN / Motor Current pick this up: an unchanged global is never
  # written to flash, so a value the user saved always wins.
  - id: !extend global_irun
    initial_value: '20'
  # Motor-driver temperature, polled from DRV_STATUS (see the 250ms interval).
  # 0 = OK, 1 = hot (OTPW prewarning, ~120 C), 2 = shut down (OT) -- live, for
  # the status text. The latch remembers a shutdown since the last home: steps
  # were lost while the driver was off, so the position can't be trusted until
  # home is set again. Shutdowns are COUNTED separately, exactly once each, from
  # GSTAT.drv_err (see drv_shutdown_seen); err_active is that flag's edge state.
  - { id: global_drv_temp,       type: int,  restore_value: no, initial_value: '0' }
  - { id: global_drv_ot_latched, type: bool, restore_value: no, initial_value: 'false' }
  - { id: global_drv_shutdowns,  type: int,  restore_value: no, initial_value: '0' }
  - { id: global_drv_err_active, type: bool, restore_value: no, initial_value: 'false' }
  # Set at the end of boot; mqtt_apply ignores calls before it (see on_boot).
  - { id: mqtt_boot_done,        type: bool, restore_value: no, initial_value: 'false' }
  # MQTT started this boot / a setting changed since (needs a restart).
  - { id: mqtt_started,          type: bool, restore_value: no, initial_value: 'false' }
  - { id: mqtt_restart_needed,   type: bool, restore_value: no, initial_value: 'false' }
  # The real MQTT password (the "MQTT Password" text only reports "(saved)").
  - id: mqtt_password_value
    type: std::string
    restore_value: yes
    max_restore_data_length: 63
    initial_value: '""'
  # Physical-button gesture state (runtime only).
  - { id: b1_down,        type: bool,     restore_value: no, initial_value: 'false' }
  - { id: b2_down,        type: bool,     restore_value: no, initial_value: 'false' }
  - { id: b1_hold_active, type: bool,     restore_value: no, initial_value: 'false' }
  - { id: b2_hold_active, type: bool,     restore_value: no, initial_value: 'false' }
  - { id: b1_consumed,    type: bool,     restore_value: no, initial_value: 'false' }
  - { id: b2_consumed,    type: bool,     restore_value: no, initial_value: 'false' }
  - { id: b1_tap_count,   type: int,      restore_value: no, initial_value: '0' }
  - { id: b1_last_tap_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  # Button 2 gets its own tap counter too: with "Swap Buttons" ON, Button 2 is the
  # close button, so it -- not Button 1 -- carries the 7-tap homing gesture. Only
  # whichever button is currently the close button ever increments its counter.
  - { id: b2_tap_count,   type: int,      restore_value: no, initial_value: '0' }
  - { id: b2_last_tap_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  # Persisted button-swap state. Like global_stepper_direction, it is the single
  # source of truth behind a stateless "Swap Buttons" select (see the select block).
  - { id: global_btn_swap, type: bool, restore_value: yes, initial_value: 'false' }

# --- Stall handling (homing) ------------------------------------------------
# The Ropener homes sensorlessly: drive at the closed end until StallGuard fires,
# and treat THAT stall as position 0. Core's default on_stall zeroes the position
# unconditionally, which is wrong here — a stall mid-travel (curtain snags) would
# silently redefine that spot as home and corrupt the cover's position reference.
#
# `!extend` APPENDS to core's action list rather than replacing it, so extending
# alone would leave core's unconditional zeroing firing before ours. The two
# entries below are deliberate and order-dependent: the first deletes core's
# handler outright, the second installs the Ropener's conditional one. Verified
# against the resolved config — exactly one on_stall survives. Keep both.
stepper:
  - id: !extend driver
    on_stall: !remove
  - id: !extend driver
    # StallGuard is an OPT-IN advanced feature (sg_enabled, default OFF). When it
    # is off, this handler no-ops even if the chip flags a stall, so the default
    # product never reacts to StallGuard at all — homing is fully manual. `!extend`
    # APPENDS, so the two entries above are order-dependent: !remove deletes core's
    # unconditional zeroing, then this installs ours. Verified against the resolved
    # config — exactly one on_stall survives.
    on_stall:
      - if:
          condition:
            lambda: 'return id(sg_enabled).state;'
          then:
            - stepper.stop: driver
            - if:
                condition:
                  lambda: 'return id(global_state) == 3;'
                then:
                  # Genuine stall while homing = the end stop. Commit home.
                  - script.execute: home_finish
                else:
                  - if:
                      # Stall in the overtravel segment of a full close (closing,
                      # already past 0): that IS the closed end, so commit it as
                      # home exactly as finishing the overtravel would. Without
                      # this, overtravel + StallGuard never re-zeroes. Bounded to
                      # position <= 0, so a mid-travel false stall cannot zero.
                      condition:
                        lambda: |-
                          return id(global_state) == 2 && id(global_overtravel_steps) > 0 &&
                                 id(driver)->current_position <= 0;
                      then:
                        - script.execute: set_home_zero
                        - logger.log: "Stall in close overtravel — closed end re-zeroed to 0"
                      # Stall outside homing (snag, or hit the far end): stop and settle,
                      # but LEAVE position alone — this point is not home, and zeroing
                      # here is what corrupted v2.7.0.
                      else:
                        - globals.set: { id: global_state, value: "0" }
                        - cover.template.publish: { id: ropener_cover, current_operation: IDLE }
                        - logger.log: "Stall detected outside homing — motor stopped, position unchanged"
    # The component's half of shutdown counting (see drv_shutdown_seen). On a
    # DIAG edge it reads GSTAT and, if drv_err is set, clears it and reports
    # DRIVER_ERROR -- so a shutdown it clears first never reaches our poll and
    # must be counted here. Key on DRIVER_ERROR, not OVERTEMPERATURE: the
    # component never re-reads OT falling, so repeat OVERTEMPERATURE events don't
    # fire.
    on_status:
      - lambda: |-
          if (code == esphome::tmc2209::DRIVER_ERROR) id(drv_shutdown_seen)->execute("DIAG");

script:
  # Count one driver shutdown, exactly once. Every shutdown (overheat or short)
  # sets GSTAT.drv_err, which stays set until cleared. Two readers clear it: our
  # 250ms poll, and the tmc2209 component on a DIAG edge (-> on_status
  # DRIVER_ERROR). Whichever clears it reports here; err_active blocks the other
  # from re-counting the same shutdown until the poll sees the flag clear. On
  # hardware neither reader alone caught them all: the old 1s/250ms OT poll
  # missed sub-poll shutdowns, and DIAG is held high during moves, so the
  # component merged several shutdowns into one late event.
  - id: drv_shutdown_seen
    parameters:
      via: string
    then:
      - lambda: |-
          if (id(global_drv_err_active)) return;
          id(global_drv_err_active) = true;
          id(global_drv_shutdowns) += 1;
          id(global_drv_ot_latched) = true;
          ESP_LOGW("ropener", "Motor driver shut off (#%d, via %s): steps lost, position may be off. Lower Motor Current.",
                   id(global_drv_shutdowns), via.c_str());

  # Start MQTT with the settings from the config page. Runs once at end of boot
  # and on every change to an MQTT setting.
  #
  # MQTT can only be STARTED at runtime, not re-pointed: on ESP32 the ESP-IDF
  # client takes its config once, on its first connect, then auto-reconnects
  # forever with it (ESPHome never disables that, and disable() only drops the
  # current connection). Verified on hardware: after a password fix it kept
  # retrying the old password every 10s. So the first start uses whatever is
  # typed in (fill in the fields, then turn on MQTT Enabled -- no restart), and
  # any change after that, including turning it off, only flags "restart to
  # apply"; the next boot starts MQTT with the saved settings. Never restarts
  # by itself, so a settings edit can't restart the curtain mid-travel.
  - id: mqtt_apply
    then:
      - lambda: |-
          if (!id(mqtt_boot_done)) return;
          if (id(mqtt_started)) {
            if (!id(mqtt_restart_needed)) ESP_LOGI("ropener", "MQTT settings changed: restart to apply");
            id(mqtt_restart_needed) = true;
            return;
          }
          auto *m = id(mqtt_client);
          std::string broker = id(mqtt_broker).state;
          const auto b = broker.find_first_not_of(" \t");
          const auto e = broker.find_last_not_of(" \t");
          broker = (b == std::string::npos) ? "" : broker.substr(b, e - b + 1);
          if (!id(mqtt_enabled).state || broker.empty()) return;
          const uint16_t port = (uint16_t) id(mqtt_port).state;
          m->set_broker_address(broker);
          m->set_broker_port(port);
          m->set_username(id(mqtt_username).state);
          m->set_password(id(mqtt_password_value));
          // Per-unit status/debug topics (compile-time ones lack the MAC suffix).
          const std::string &p = m->get_topic_prefix();
          m->set_birth_message(mqtt::MQTTMessage{p + "/status", "online", 0, true});
          m->set_last_will(mqtt::MQTTMessage{p + "/status", "offline", 0, true});
          m->set_shutdown_message(mqtt::MQTTMessage{p + "/status", "offline", 0, true});
          m->set_log_message_template(mqtt::MQTTMessage{p + "/debug", "", 0, true});
          m->enable();
          id(mqtt_started) = true;
          ESP_LOGI("ropener", "MQTT: connecting to %s:%u", broker.c_str(), (unsigned) port);

  # Derive TCOOLTHRS from the configured Speed.
  #
  # StallGuard only reports while TSTEP <= TCOOLTHRS, and TSTEP is inversely
  # proportional to velocity. Measured on VAL3000 hardware (microsteps=8),
  # within 1% from Speed 3000 to 9000 under real curtain load:
  #
  #     TSTEP ~= 374000 / Speed
  #
  # So the shipped default of TCOOLTHRS=100 arms only above Speed ~3740. Below
  # that, StallGuard is switched off entirely -- no error, no log line, nothing
  # in the UI, and homing simply never completes. That is a setting a customer
  # can reach just by dragging the Speed slider down for a quieter curtain.
  #
  # 2x cruise TSTEP arms from half of cruise speed upward at any Speed, which
  # keeps the deliberate low-velocity cutoff (SG_RESULT is unreliable when slow,
  # which is what TCOOLTHRS is for) while guaranteeing it actually engages.
  - id: recompute_tcoolthrs
    then:
      - lambda: |-
          uint32_t sp = id(global_speed) > 0 ? (uint32_t) id(global_speed) : 1;
          uint32_t v = 748000UL / sp;
          if (v > 1048575) v = 1048575;      // TCOOLTHRS is a 20-bit register
          id(global_tcoolthrs) = (int) v;
          id(driver)->write_register(TCOOLTHRS, v);

  # Recompute the derived step caches from the persisted centimeters (one place).
  - id: recompute_distance
    then:
      - globals.set:
          id: global_distance_steps
          value: !lambda "return (float(id(global_distance_cm)) / ${gear_distance_cm}) * ${steps_per_revolution};"
      - globals.set:
          id: global_overtravel_steps
          value: !lambda "return (id(global_overtravel_cm) / ${gear_distance_cm}) * ${steps_per_revolution};"

  # --- Homing (manual by default; StallGuard only assists when sg_enabled) -----
  # Drive toward the closed end at a fixed gentle speed. It ends one of three
  # ways: the user presses Start-Stop again (home_finish), the timeout fires
  # (home_abort), or -- only if sg_enabled -- StallGuard trips (home_finish).
  #
  # Drives RELATIVE (current - 100000) and does NOT zero at start, so an aborted
  # home leaves the position honest instead of committing a false zero. Home is
  # committed to 0 only by a deliberate finish.
  - id: home_start
    then:
      - globals.set: { id: global_state, value: "3" }
      - cover.template.publish: { id: ropener_cover, current_operation: CLOSING }
      - stepper.set_speed:
          id: driver
          speed: ${home_speed}
      - stepper.set_target:
          id: driver
          target: !lambda "return id(driver)->current_position - 100000;"
      - script.execute: home_timeout
      - logger.log: "Homing started — press Start-Stop again at the closed end to set home"

  # Reached the real closed end: commit position 0 as home, restore run speed.
  - id: home_finish
    then:
      - script.stop: home_timeout
      - stepper.stop: driver
      - stepper.report_position: { id: driver, position: 0 }
      - stepper.set_target: { id: driver, target: 0 }
      - stepper.set_speed: { id: driver, speed: !lambda "return id(global_speed);" }
      - globals.set: { id: global_state, value: "0" }
      - globals.set: { id: global_current_position, value: "0" }
      - globals.set: { id: global_drv_ot_latched, value: "false" }   # position trusted again
      - cover.template.publish: { id: ropener_cover, current_operation: IDLE }
      - logger.log: "Home set to 0"

  # Timeout (or any abort): stop, restore run speed, and DO NOT set home. The
  # position is left exactly where it is -- committing a home on an accidental or
  # timed-out press is what corrupts the reference and inverts open/close.
  - id: home_abort
    then:
      - stepper.stop: driver
      - stepper.set_target:
          id: driver
          target: !lambda "return id(driver)->current_position;"
      - stepper.set_speed: { id: driver, speed: !lambda "return id(global_speed);" }
      - globals.set: { id: global_state, value: "0" }
      - cover.template.publish: { id: ropener_cover, current_operation: IDLE }
      - logger.log: "Homing timed out — aborted, home NOT set (position unchanged)"

  # Unconditional backstop: if still homing after home_timeout_s, abort. Covers an
  # accidental Start-Stop press AND a mis-tuned StallGuard that never trips.
  - id: home_timeout
    mode: restart
    then:
      - delay: ${home_timeout_s}s
      - if:
          condition: { lambda: 'return id(global_state) == 3;' }
          then:
            - script.execute: home_abort

  # Declare current position as home (0) — the two-button "set home here" combo.
  - id: set_home_zero
    then:
      - script.stop: home_timeout
      - stepper.stop: driver
      - stepper.report_position: { id: driver, position: 0 }
      - stepper.set_target: { id: driver, target: 0 }
      - stepper.set_speed: { id: driver, speed: !lambda "return id(global_speed);" }
      - globals.set: { id: global_state, value: "0" }
      - globals.set: { id: global_current_position, value: "0" }
      - globals.set: { id: global_drv_ot_latched, value: "false" }   # position trusted again
      - cover.template.publish: { id: ropener_cover, current_operation: IDLE }
      - logger.log: "Home position set to 0"

  # Hold-to-run engage (armed on press, fired after hold_run_ms).
  # Hold-to-run for each button. The MOTION depends on the button's current role
  # (set by the "Swap Buttons" select): the close button drives close, the open
  # button drives open. Button 1 is the close button when swap is OFF; Button 2 is
  # the close button when swap is ON.
  - id: b1_hold_check
    mode: restart
    then:
      - delay: ${hold_run_ms}ms
      - if:
          condition:
            lambda: 'return id(b1_down) && !id(b2_down) && id(global_state) == 0 && id(b1_tap_count) < 7;'
          then:
            - globals.set: { id: b1_hold_active, value: "true" }
            - globals.set: { id: b1_consumed, value: "true" }
            - if:
                condition: { lambda: 'return !id(global_btn_swap);' }
                then:
                  - cover.close: ropener_cover
                  - logger.log: "Button 1 held: closing while held"
                else:
                  - cover.open: ropener_cover
                  - logger.log: "Button 1 held: opening while held"
  - id: b2_hold_check
    mode: restart
    then:
      - delay: ${hold_run_ms}ms
      - if:
          condition:
            lambda: 'return id(b2_down) && !id(b1_down) && id(global_state) == 0 && id(b2_tap_count) < 7;'
          then:
            - globals.set: { id: b2_hold_active, value: "true" }
            - globals.set: { id: b2_consumed, value: "true" }
            - if:
                condition: { lambda: 'return id(global_btn_swap);' }
                then:
                  - cover.close: ropener_cover
                  - logger.log: "Button 2 held: closing while held"
                else:
                  - cover.open: ropener_cover
                  - logger.log: "Button 2 held: opening while held"

  # Deferred single-tap CLOSE, one per button. Only the current close button ever
  # schedules its commit (the open button opens immediately on release); the delay
  # lets a 7-tap homing burst chain without the first tap committing a close.
  - id: b1_tap_commit
    mode: restart
    then:
      - delay: ${tap_window_ms}ms
      - if:
          condition:
            lambda: 'return id(global_state) == 0 && id(b1_tap_count) < 7;'
          then:
            - cover.close: ropener_cover
            - logger.log: "Button 1 tap: closing"
      - globals.set: { id: b1_tap_count, value: "0" }
  - id: b2_tap_commit
    mode: restart
    then:
      - delay: ${tap_window_ms}ms
      - if:
          condition:
            lambda: 'return id(global_state) == 0 && id(b2_tap_count) < 7;'
          then:
            - cover.close: ropener_cover
            - logger.log: "Button 2 tap: closing"
      - globals.set: { id: b2_tap_count, value: "0" }

  # Two-button "set home" combo.
  - id: combo_home
    mode: restart
    then:
      - delay: ${combo_home_ms}ms
      - if:
          condition:
            lambda: 'return id(b1_down) && id(b2_down);'
          then:
            - script.execute: set_home_zero
            - globals.set: { id: b1_consumed, value: "true" }
            - globals.set: { id: b2_consumed, value: "true" }
            - globals.set: { id: b1_tap_count, value: "0" }
            - logger.log: "Both buttons held: home position set"

  # ---- Scheduling contract (called by common/scheduling.yaml) ----------------
  # scheduling decides WHEN; these decide HOW. Guard against interrupting homing.
  - id: schedule_open
    then:
      - if:
          condition:
            lambda: 'return id(global_state) != 3;'
          then:
            - cover.open: ropener_cover
  - id: schedule_close
    then:
      - if:
          condition:
            lambda: 'return id(global_state) != 3;'
          then:
            - cover.close: ropener_cover

# --- Attach Ropener button behaviour onto core's bare buttons (btn1/btn2/btn3)
# Core shows Button 1/2/3 in Control, where they read as clickable controls but
# are only press indicators for the physical buttons. Move them to the bottom of
# Diagnostics (still handy for checking the hardware buttons work). Web page
# only -- they stay in Home Assistant unchanged for automations.
binary_sensor:
  - id: !extend btn1
    web_server: { sorting_weight: 20, sorting_group_id: group_diagnostics }
    on_press:
      - globals.set: { id: b1_down, value: "true" }
      - if:
          condition: { lambda: 'return id(global_state) == 3;' }
          then:
            - script.stop: b1_hold_check
            - script.stop: b1_tap_commit
            - script.execute: set_home_zero
            - globals.set: { id: b1_consumed, value: "true" }
            - globals.set: { id: b1_tap_count, value: "0" }
            - logger.log: "Homing cancelled (Button 1)"
          else:
            - if:
                condition: { lambda: 'return id(global_state) == 1 || id(global_state) == 2;' }
                then:
                  - script.stop: b1_hold_check
                  - script.stop: b1_tap_commit
                  - cover.stop: ropener_cover
                  - globals.set: { id: b1_consumed, value: "true" }
                  - globals.set: { id: b1_tap_count, value: "0" }
                else:
                  - if:
                      condition: { lambda: 'return id(b2_down);' }
                      then:
                        - script.stop: b1_hold_check
                        - script.stop: b2_hold_check
                        - script.stop: b1_tap_commit
                        - script.stop: b2_tap_commit
                        - cover.stop: ropener_cover
                        - globals.set: { id: b1_hold_active, value: "false" }
                        - globals.set: { id: b2_hold_active, value: "false" }
                        - globals.set: { id: b1_consumed, value: "true" }
                        - globals.set: { id: b2_consumed, value: "true" }
                        - script.execute: combo_home
                      else:
                        # Idle, single button. Behaviour depends on Button 1's role.
                        - if:
                            condition: { lambda: 'return !id(global_btn_swap);' }
                            then:
                              # CLOSE button: count taps (7 -> homing), defer the close.
                              - script.stop: b1_tap_commit
                              - lambda: |-
                                  uint32_t now = millis();
                                  if (now - id(b1_last_tap_ms) > ${tap_window_ms}) id(b1_tap_count) = 0;
                                  id(b1_tap_count) += 1;
                                  id(b1_last_tap_ms) = now;
                              - globals.set: { id: b1_consumed, value: "false" }
                              - if:
                                  condition: { lambda: 'return id(b1_tap_count) >= 7;' }
                                  then:
                                    - script.stop: b1_hold_check
                                    - globals.set: { id: b1_tap_count, value: "0" }
                                    - globals.set: { id: b1_consumed, value: "true" }
                                    - script.execute: home_start
                                    - logger.log: "Button 1 x7: starting homing"
                                  else:
                                    - script.execute: b1_hold_check
                            else:
                              # OPEN button: no homing gesture; open immediately on release.
                              - globals.set: { id: b1_tap_count, value: "0" }
                              - globals.set: { id: b1_consumed, value: "false" }
                              - script.execute: b1_hold_check
    on_release:
      - globals.set: { id: b1_down, value: "false" }
      - script.stop: b1_hold_check
      - script.stop: combo_home
      - if:
          condition: { lambda: 'return id(b1_hold_active);' }
          then:
            - cover.stop: ropener_cover
            - globals.set: { id: b1_hold_active, value: "false" }
            - globals.set: { id: b1_consumed, value: "false" }
            - logger.log: "Button 1 released: stopped"
          else:
            - if:
                condition: { lambda: 'return id(b1_consumed);' }
                then:
                  - globals.set: { id: b1_consumed, value: "false" }
                else:
                  # Tap: the close button defers (allows 7-tap chaining); the open
                  # button opens immediately.
                  - if:
                      condition: { lambda: 'return !id(global_btn_swap);' }
                      then:
                        - script.execute: b1_tap_commit
                      else:
                        - cover.open: ropener_cover
                        - logger.log: "Button 1 tap: opening"

  - id: !extend btn2
    web_server: { sorting_weight: 21, sorting_group_id: group_diagnostics }
    on_press:
      - globals.set: { id: b2_down, value: "true" }
      - if:
          condition: { lambda: 'return id(global_state) == 3;' }
          then:
            - script.stop: b2_hold_check
            - script.stop: b2_tap_commit
            - script.execute: set_home_zero
            - globals.set: { id: b2_consumed, value: "true" }
            - globals.set: { id: b2_tap_count, value: "0" }
            - logger.log: "Homing cancelled (Button 2)"
          else:
            - if:
                condition: { lambda: 'return id(global_state) == 1 || id(global_state) == 2;' }
                then:
                  - script.stop: b2_hold_check
                  - script.stop: b2_tap_commit
                  - cover.stop: ropener_cover
                  - globals.set: { id: b2_consumed, value: "true" }
                  - globals.set: { id: b2_tap_count, value: "0" }
                else:
                  - if:
                      condition: { lambda: 'return id(b1_down);' }
                      then:
                        - script.stop: b1_hold_check
                        - script.stop: b2_hold_check
                        - script.stop: b1_tap_commit
                        - script.stop: b2_tap_commit
                        - cover.stop: ropener_cover
                        - globals.set: { id: b1_hold_active, value: "false" }
                        - globals.set: { id: b2_hold_active, value: "false" }
                        - globals.set: { id: b1_consumed, value: "true" }
                        - globals.set: { id: b2_consumed, value: "true" }
                        - globals.set: { id: b1_tap_count, value: "0" }
                        - globals.set: { id: b2_tap_count, value: "0" }
                        - script.execute: combo_home
                      else:
                        # Idle, single button. Behaviour depends on Button 2's role.
                        - if:
                            condition: { lambda: 'return id(global_btn_swap);' }
                            then:
                              # CLOSE button (swap ON): count taps (7 -> homing), defer close.
                              - script.stop: b2_tap_commit
                              - lambda: |-
                                  uint32_t now = millis();
                                  if (now - id(b2_last_tap_ms) > ${tap_window_ms}) id(b2_tap_count) = 0;
                                  id(b2_tap_count) += 1;
                                  id(b2_last_tap_ms) = now;
                              - globals.set: { id: b2_consumed, value: "false" }
                              - if:
                                  condition: { lambda: 'return id(b2_tap_count) >= 7;' }
                                  then:
                                    - script.stop: b2_hold_check
                                    - globals.set: { id: b2_tap_count, value: "0" }
                                    - globals.set: { id: b2_consumed, value: "true" }
                                    - script.execute: home_start
                                    - logger.log: "Button 2 x7: starting homing"
                                  else:
                                    - script.execute: b2_hold_check
                            else:
                              # OPEN button: no homing gesture; open immediately on release.
                              - globals.set: { id: b2_tap_count, value: "0" }
                              - globals.set: { id: b2_consumed, value: "false" }
                              - script.execute: b2_hold_check
    on_release:
      - globals.set: { id: b2_down, value: "false" }
      - script.stop: b2_hold_check
      - script.stop: combo_home
      - if:
          condition: { lambda: 'return id(b2_hold_active);' }
          then:
            - cover.stop: ropener_cover
            - globals.set: { id: b2_hold_active, value: "false" }
            - globals.set: { id: b2_consumed, value: "false" }
            - logger.log: "Button 2 released: stopped"
          else:
            - if:
                condition: { lambda: 'return id(b2_consumed);' }
                then:
                  - globals.set: { id: b2_consumed, value: "false" }
                else:
                  # Tap: the close button defers (allows 7-tap chaining); the open
                  # button opens immediately.
                  - if:
                      condition: { lambda: 'return id(global_btn_swap);' }
                      then:
                        - script.execute: b2_tap_commit
                      else:
                        - cover.open: ropener_cover
                        - logger.log: "Button 2 tap: opening"

  # Rename core's "Button 3 (Wi-Fi reset)" to Ropener's "WiFi Reset" and attach
  # the hold-to-erase-credentials action.
  - id: !extend btn3
    name: "WiFi Reset"
    web_server: { sorting_weight: 22, sorting_group_id: group_diagnostics }
    on_click:
      - min_length: 3000ms
        max_length: 10000ms
        then:
          - logger.log: "Clearing saved Wi-Fi credentials and rebooting into setup"
          - lambda: |-
              esphome::wifi::global_wifi_component->save_wifi_sta("", "");
              esphome::wifi::global_wifi_component->clear_sta();
          - delay: 1s
          - lambda: "App.safe_reboot();"

# --- Preserve the shipped "Motor Direction" option strings --------------------
# Field units (and any Home Assistant automation that selects a direction) know
# this option as "Reversed ↺" — the glyph is part of the string, not decoration.
# valar-core dropped it to a plain "Reversed", which would silently break those
# automations and leave existing units holding an option that no longer exists.
# `options` is a list, so !extend would APPEND and yield three choices; remove
# then re-add instead. `lambda` is a scalar, so extending overwrites it cleanly.
# Core's set_action matches on `x.find("Reversed")`, which still hits — no
# override needed there.
select:
  - id: !extend sel_direction
    options: !remove
  - id: !extend sel_direction
    options:
      - "Normal"
      - "Reversed ↺"
    lambda: |-
      if (id(global_stepper_direction) == esphome::tmc2209::ShaftDirection::COUNTERCLOCKWISE)
        return std::string("Reversed ↺");
      return std::string("Normal");

  # Friendly Slow / Medium / Fast speed, chosen to straddle the ~2000 drivetrain
  # resonance (measured): Slow 1500 sits below it, Medium 5000 and Fast 9000 above.
  # Like Motor Direction, this holds NO state of its own -- it reads and writes
  # global_speed (the single source of truth, restored on boot) so it never fights
  # the restored value. The raw Speed slider lives in the advanced group.
  # Publish-on-change: no polling (a 1s poll republished the unchanged value
  # every second -- ~1/s of MQTT traffic per entity, idle). Refreshed instead at
  # end of boot, here, and by num_speed's set_action (the only other writer of
  # global_speed).
  - platform: template
    name: "Speed"
    id: sel_speed
    icon: "mdi:speedometer"
    entity_category: CONFIG
    web_server: { sorting_weight: 1, sorting_group_id: group_tuning }
    update_interval: never
    options: ["Slow", "Medium", "Fast"]
    lambda: |-
      const int sp = id(global_speed);
      if (sp <= 2000) return std::string("Slow");     // <= resonance edge
      if (sp <= 6500) return std::string("Medium");
      return std::string("Fast");
    set_action:
      - lambda: |-
          int s = 9000;                                // Fast
          if (x.find("Slow") != std::string::npos) s = 1500;
          else if (x.find("Medium") != std::string::npos) s = 5000;
          id(global_speed) = s;
      - stepper.set_speed: { id: driver, speed: !lambda "return id(global_speed);" }
      - script.execute: recompute_tcoolthrs
      - lambda: |-
          // Persist immediately, like Motor Direction, so the choice survives an
          // unplug seconds later.
          global_speed->update();
          global_preferences->sync();
      - component.update: sel_speed

  # Swap the two physical buttons' open/close roles -- same select UI as Motor
  # Direction, and its sibling install-orientation setting (sits right under it in
  # Setup). "Normal" = Button 1 closes, Button 2 opens (the shipped layout).
  # "Swapped" = Button 1 opens, Button 2 closes -- for a mirror-image install (e.g.
  # pull-rope on the left) where the flipped unit makes the buttons feel reversed.
  # The 7-tap homing gesture and the deferred single-tap always follow the CLOSE
  # button. Like Motor Direction it holds NO state of its own: it reads and writes
  # the persisted global_btn_swap, so it never fights the restored value. Only
  # remaps the on-device buttons; the web UI, Home Assistant, and the schedule
  # open/close are unaffected. (A left-side install usually wants Motor Direction =
  # Reversed too.)
  - platform: template
    name: "Swap Buttons"
    id: sel_btn_swap
    icon: "mdi:swap-horizontal"
    entity_category: CONFIG
    web_server: { sorting_weight: 2, sorting_group_id: group_setup }
    update_interval: never   # publish-on-change: refreshed at boot and below
    options:
      - "Normal"
      - "Swapped ↔"
    lambda: |-
      if (id(global_btn_swap)) return std::string("Swapped ↔");
      return std::string("Normal");
    set_action:
      - lambda: |-
          id(global_btn_swap) = (x.find("Swap") != std::string::npos);
          global_btn_swap->update();
          global_preferences->sync();
      - component.update: sel_btn_swap

# --- Rename core tuning entities to Ropener's existing entity_ids -------------
number:
  # Raw IRUN (register 1-31) is meaningless to users -- the friendly "Motor
  # Current" number below drives it in milliamps instead. Keep the raw register
  # in the advanced group for power users.
  - id: !extend num_irun
    name: "IRUN value"
    web_server: { sorting_weight: 7, sorting_group_id: group_sg }
    # Appends to core's set_action: IRUN changes the register Motor Current
    # mirrors, and Motor Current no longer polls.
    set_action:
      - component.update: num_motor_current
  # Friendly motor current in mA. The driver knows Rsense (100 mOhm) and Vsense,
  # so write_run_current_mA / read_run_current_mA do the register conversion --
  # no formula here. Max is the register ceiling (~1915 mA at these settings);
  # the motor is rated 2 A continuous, so nothing the driver can produce is
  # thermally unsafe. Values snap to the nearest of 32 register steps (~60 mA).
  - platform: template
    name: "Motor Current"
    id: num_motor_current
    unit_of_measurement: "mA"
    icon: "mdi:current-dc"
    web_server: { sorting_weight: 3, sorting_group_id: group_tuning }
    min_value: 100
    max_value: 1900
    step: 10
    mode: BOX
    entity_category: CONFIG
    lambda: "return id(driver)->read_run_current_mA();"
    # Publish-on-change: refreshed at end of boot, here, and by num_irun (the
    # only other writer of the IRUN register).
    update_interval: never
    set_action:
      - lambda: "id(driver)->write_run_current_mA((uint16_t) x);"
      # Keep global_irun (persisted, reapplied in on_boot) in sync with the
      # register field the driver just derived.
      - globals.set:
          id: global_irun
          value: !lambda "return id(driver)->read_field(IRUN_FIELD);"
      - component.update: num_motor_current
  # TCOOLTHRS and SGTHRS are StallGuard tuning -> move them to the bottom group_sg
  # (core puts them in group_stallguard, which we're retiring in favour of group_sg).
  - id: !extend num_tcoolthrs
    name: "TCOOLTHRS value"
    web_server: { sorting_weight: 4, sorting_group_id: group_sg }
  - id: !extend num_sgthrs
    name: "SGTHRS value"
    web_server: { sorting_weight: 3, sorting_group_id: group_sg }
  # Raw Speed (steps/s) is now driven by the friendly Slow/Medium/Fast preset
  # select below; keep the exact slider in the advanced group. !extend APPENDS to
  # core's set_action, so core still stores global_speed and pushes it to the
  # driver, then recompute_tcoolthrs runs.
  - id: !extend num_speed
    web_server: { sorting_weight: 8, sorting_group_id: group_sg }
    set_action:
      - script.execute: recompute_tcoolthrs
      - component.update: sel_speed   # the preset mirrors global_speed, no polling
  # Acceleration is core's last remaining member of group_motion (Speed moved to the
  # advanced group above). Move it to group_tuning too so core's group_motion is fully
  # empty and does not render a duplicate "Motion Tuning" header.
  - id: !extend num_accel
    web_server: { sorting_weight: 2, sorting_group_id: group_tuning }
  # Product-only: travel distance in centimeters (drives the cover's 0..1 range).
  - platform: template
    name: "Centimeters"
    id: num_centimeters
    web_server: { sorting_weight: 1, sorting_group_id: group_setup }
    step: 1
    min_value: 1
    max_value: 9000
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_distance_cm);
    update_interval: never   # publish-on-change: refreshed at boot and below
    set_action:
      then:
        - globals.set: { id: global_distance_cm, value: !lambda "return x;" }
        - script.execute: recompute_distance
        - component.update: num_centimeters
  # MQTT broker port (see mqtt_apply). 1883 is plain MQTT; TLS isn't supported.
  - platform: template
    name: "MQTT Port"
    id: mqtt_port
    icon: "mdi:numeric"
    entity_category: CONFIG
    web_server: { sorting_weight: 3, sorting_group_id: group_mqtt }
    min_value: 1
    max_value: 65535
    step: 1
    mode: BOX
    optimistic: true
    restore_value: true
    initial_value: 1883
    on_value:
      - script.execute: mqtt_apply
  # Product-only: how far past 0 a full close drives before re-zeroing (see
  # global_overtravel_cm). Same cm units as Centimeters. 0 = off.
  - platform: template
    name: "Close Overtravel"
    id: num_overtravel
    icon: "mdi:arrow-collapse-horizontal"
    unit_of_measurement: "cm"
    web_server: { sorting_weight: 3, sorting_group_id: group_setup }
    step: 0.5
    min_value: 0
    max_value: 10
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_overtravel_cm);
    update_interval: never   # publish-on-change: refreshed at boot and below
    set_action:
      then:
        - globals.set: { id: global_overtravel_cm, value: !lambda "return x;" }
        - script.execute: recompute_distance
        - component.update: num_overtravel

sensor:
  # Percent open, for the web page: with the cover row moved to Diagnostics,
  # nothing else on the page shows how open the curtain is. Reads the cover's own
  # (0-clamped) position. Rounded to whole percent + delta so it only publishes
  # when the displayed value changes, not every poll.
  - platform: template
    name: "Position"
    id: sen_position
    icon: "mdi:curtains"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    web_server: { sorting_weight: 2.1, sorting_group_id: group_control }
    update_interval: 500ms
    lambda: "return roundf(id(ropener_cover).position * 100.0f);"
    filters:
      - delta: 0.5
  # Motor-driver shutdowns since boot (see drv_shutdown_seen). Each one lost
  # steps, so a non-zero count on a drifting curtain points straight at heat:
  # lower Motor Current. Also lets a test compare counted vs heard cut-outs.
  - platform: template
    name: "Driver Shutdowns"
    id: sen_drv_shutdowns
    icon: "mdi:thermometer-off"
    entity_category: DIAGNOSTIC
    accuracy_decimals: 0
    web_server: { sorting_weight: 3.1, sorting_group_id: group_diagnostics }
    update_interval: 1s
    lambda: "return id(global_drv_shutdowns);"
    filters:
      - delta: 0.5
  # SG_RESULT and TSTEP are raw StallGuard tuning data -- meaningless with
  # StallGuard off -- so move them out of Diagnostics into the StallGuard group,
  # alongside SGTHRS/TCOOLTHRS and the enable switch.
  - id: !extend sen_sgresult
    name: "SG_RESULT Sensor"
    web_server: { sorting_weight: 5, sorting_group_id: group_sg }
  - id: !extend sen_tstep
    name: "TSTEP Sensor"
    web_server: { sorting_weight: 6, sorting_group_id: group_sg }

# --- The curtain cover --------------------------------------------------------
cover:
  - platform: template
    id: ropener_cover
    name: Ropener
    # A curtain draws sideways, not up and down. With no device_class the UI
    # falls back to generic up/down arrows; "curtain" gets the horizontal
    # open/close controls (and the right icon in Home Assistant).
    device_class: curtain
    # Diagnostics, not Control: on the web page the Open/Stop/Close buttons and
    # the Position readout replace this row (its ↑ is disabled whenever the
    # curtain is part-open -- see button:). Web page only; HA is unaffected.
    web_server: { sorting_weight: 23, sorting_group_id: group_diagnostics }
    has_position: true
    assumed_state: false
    # Clamped at 0: during close overtravel the position is briefly negative,
    # which Home Assistant and the web UI would show as a negative percentage.
    # Rounded to whole percent: the template cover publishes whenever this value
    # changes, and the raw ratio changes on every step -- measured over MQTT at
    # ~1500 state + ~1500 position messages for a 4% move (Home Assistant got the
    # same flood over the API). Motion logic never reads this; it uses the
    # driver's step position.
    lambda: "return std::max(0.0f, roundf(100.0f * float(id(driver)->current_position) / float(id(global_distance_steps))) / 100.0f);"
    stop_action:
      - stepper.stop: driver
      - globals.set: { id: global_state, value: "0" }
      - cover.template.publish: { id: ropener_cover, current_operation: IDLE }
    open_action:
      - globals.set: { id: global_state, value: "1" }
      - cover.template.publish: { id: ropener_cover, current_operation: OPENING }
      - stepper.set_target: { id: driver, target: !lambda return id(global_distance_steps); }
    # A full close targets -overtravel (0 when off); the motion-completion poll
    # re-zeroes when a close finishes below 0.
    close_action:
      - globals.set: { id: global_state, value: "2" }
      - cover.template.publish: { id: ropener_cover, current_operation: CLOSING }
      - stepper.set_target: { id: driver, target: !lambda return -id(global_overtravel_steps); }
    # A move to 0% is a full close, so it gets the same overtravel as Close.
    position_action:
      - if:
          condition:
            lambda: 'return pos > 0.0f && (pos * id(global_distance_steps)) >= id(driver)->current_position;'
          then:
            - globals.set: { id: global_state, value: "1" }
            - cover.template.publish: { id: ropener_cover, current_operation: OPENING }
          else:
            - globals.set: { id: global_state, value: "2" }
            - cover.template.publish: { id: ropener_cover, current_operation: CLOSING }
      - stepper.set_target:
          id: driver
          target: !lambda |-
            if (pos <= 0.0f) return -id(global_overtravel_steps);
            return pos * id(global_distance_steps);

button:
  # Always-enabled Open / Stop / Close for the device's own web page. ESPHome's
  # web UI disables the cover's ↑ whenever its state is OPEN -- which for a
  # positioned cover is ANY position above 0 -- and offers no position slider, so
  # a part-open curtain could not be opened from the config page at all. (The web
  # server never sends assumed_state for covers, so that flag can't fix it.) The
  # cover row itself must stay for Home Assistant, so it moves to Diagnostics
  # instead. Close also lets you re-push at 0% when Close Overtravel is on.
  - platform: template
    name: "Open"
    icon: "mdi:curtains"
    web_server: { sorting_weight: 1.1, sorting_group_id: group_control }
    on_press:
      - cover.open: ropener_cover
  # Stop while homing = "this is the closed end": commit home, exactly like a
  # physical button press or a second Start-Stop Homing press (the guide tells
  # users to "press Stop" there). The cover's own stop would instead cancel the
  # home and leave the motor at home_speed.
  - platform: template
    name: "Stop"
    icon: "mdi:stop"
    web_server: { sorting_weight: 1.2, sorting_group_id: group_control }
    on_press:
      - if:
          condition: { lambda: 'return id(global_state) == 3;' }
          then:
            - script.execute: home_finish
          else:
            - cover.stop: ropener_cover
  - platform: template
    name: "Close"
    icon: "mdi:curtains-closed"
    web_server: { sorting_weight: 1.3, sorting_group_id: group_control }
    on_press:
      - cover.close: ropener_cover
  # Applies changed MQTT settings (see mqtt_apply for why a restart is needed).
  - platform: template
    name: "Restart to Apply"
    icon: "mdi:restart"
    entity_category: CONFIG
    web_server: { sorting_weight: 7, sorting_group_id: group_mqtt }
    on_press:
      - lambda: "App.safe_reboot();"
  - platform: template
    name: "Start-Stop Homing"
    web_server: { sorting_weight: 3, sorting_group_id: group_control }
    entity_category: DIAGNOSTIC
    on_press:
      - if:
          condition: { lambda: 'return id(global_state) == 3;' }
          then:
            # Second press at the closed end: commit home.
            - script.execute: home_finish
          else:
            # First press: start homing (drives closed at ${home_speed}).
            - script.execute: home_start

# StallGuard is now advanced/experimental, so its controls sit at the very bottom.
# Core's group_sg (weight 40) can't be re-weighted from here -- package
# merge duplicates the id rather than overriding it -- so instead we define a NEW
# group below Diagnostics (60) and reassign every StallGuard entity to it. Core's
# original group is left with no members and does not render.
web_server:
  sorting_groups:
    # Core puts Motion Tuning at weight 30 (below Schedule at 25). We can't re-weight
    # a core group from the product layer (the id would be redefined), so define a NEW
    # group at weight 22 -- directly under Setup (20), above Schedule (25) -- and move
    # every motion entity to it. Core's group_motion is left empty and does not render.
    - { id: group_tuning, name: "Motion Tuning", sorting_weight: 22 }
    # MQTT settings: optional, so below the everyday groups, above Diagnostics (60).
    - { id: group_mqtt, name: "MQTT", sorting_weight: 50 }
    - { id: group_sg, name: "StallGuard (experimental)", sorting_weight: 70 }

# MQTT connection settings, typed on the config page (see mqtt: and mqtt_apply).
# All restored across reboots and firmware updates. Turning MQTT Enabled on
# starts it with these; a change after that applies on the next restart.
text:
  - platform: template
    name: "MQTT Broker"
    id: mqtt_broker
    icon: "mdi:server-network"
    entity_category: CONFIG
    web_server: { sorting_weight: 2, sorting_group_id: group_mqtt }
    mode: text
    min_length: 0
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - script.execute: mqtt_apply
  - platform: template
    name: "MQTT Username"
    id: mqtt_username
    icon: "mdi:account"
    entity_category: CONFIG
    web_server: { sorting_weight: 4, sorting_group_id: group_mqtt }
    mode: text
    min_length: 0
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - script.execute: mqtt_apply
  # Write-only. ESPHome's web server masks a password text's "state" but still
  # sends the real text in "value", so anyone on the LAN could read it from
  # /text/MQTT Password. So the real password lives in mqtt_password_value and
  # this entity only ever reports "(saved)" or "". Typing a new one saves it; the
  # page echoing "(saved)" back is ignored rather than stored as the password.
  - platform: template
    name: "MQTT Password"
    id: mqtt_password
    icon: "mdi:form-textbox-password"
    entity_category: CONFIG
    web_server: { sorting_weight: 5, sorting_group_id: group_mqtt }
    mode: password
    min_length: 0
    max_length: 63
    update_interval: never   # publish-on-change: refreshed at boot and below
    lambda: 'return {id(mqtt_password_value).empty() ? std::string("") : std::string("(saved)")};'
    set_action:
      - if:
          condition:
            lambda: 'return x != "(saved)";'
          then:
            - globals.set: { id: mqtt_password_value, value: !lambda "return x;" }
            - component.update: mqtt_password
            - script.execute: mqtt_apply

switch:
  - platform: template
    name: "MQTT Enabled"
    id: mqtt_enabled
    icon: "mdi:lan-connect"
    entity_category: CONFIG
    web_server: { sorting_weight: 1, sorting_group_id: group_mqtt }
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: mqtt_apply
    on_turn_off:
      - script.execute: mqtt_apply
  # Master opt-in for StallGuard. Default OFF: the shipped product homes manually
  # (Start-Stop button) and never reacts to a chip stall. Turn this on only to
  # use sensorless auto-homing / obstruction detection, which needs SGTHRS tuned
  # to the installed load (see the StallGuard group). Mirrors Glasscalibur's
  # stallguard_enabled. on_stall no-ops while this is off.
  - platform: template
    name: "StallGuard Enabled"
    id: sg_enabled
    icon: "mdi:shield-search"
    entity_category: CONFIG
    web_server: { sorting_weight: 1, sorting_group_id: group_sg }
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

text_sensor:
  # Surfaces StallGuard's arming state, which is otherwise invisible. The
  # failure it exists to catch: if TCOOLTHRS is below the cruise TSTEP for the
  # configured Speed, StallGuard NEVER reports, homing never completes, and
  # nothing anywhere says so. Diagnosed here from the configured Speed, so a
  # misconfiguration is visible while the curtain is standing still rather than
  # only discovered when homing silently fails.
  #
  # "Below threshold" during acceleration is normal and expected -- StallGuard
  # is deliberately disarmed at low velocity, which is what TCOOLTHRS is for.
  # A reading that never leaves it once at speed is the real fault.
  - platform: template
    name: "StallGuard"
    id: sg_status
    icon: "mdi:shield-search"
    entity_category: DIAGNOSTIC
    web_server: { sorting_weight: 2, sorting_group_id: group_sg }
    update_interval: 1s
    lambda: |-
      if (!id(sg_enabled).state) return {"Disabled"};
      const uint32_t tc = id(driver)->read_register(TCOOLTHRS);
      // Predicted cruise TSTEP for the configured Speed (measured constant).
      const uint32_t sp = id(global_speed) > 0 ? (uint32_t) id(global_speed) : 1;
      const uint32_t cruise = 374000UL / sp;
      if (cruise > tc)
        return {"Never arms at this Speed"};
      const uint32_t ts = id(driver)->read_register(TSTEP);
      if (ts >= 0xFFFFF) return {"Ready (stopped)"};
      if (ts <= tc)      return {"Armed"};
      return {"Below threshold"};
    # Publish-on-change for the live status texts: they still poll (their value
    # comes from many places), but an unchanged result is dropped instead of
    # republished -- each was ~1-2 MQTT messages/s while idle. Each use of this
    # anchor compiles to its own lambda, so `last` is per entity.
    filters: &publish_on_change
      - lambda: |-
          static std::string last;
          if (x == last) return {};
          last = x;
          return x;

  # Whether MQTT is actually connected, and where its topics live.
  - platform: template
    name: "MQTT Status"
    id: mqtt_status
    icon: "mdi:lan-check"
    entity_category: DIAGNOSTIC
    web_server: { sorting_weight: 6, sorting_group_id: group_mqtt }
    update_interval: 2s
    lambda: |-
      if (id(mqtt_restart_needed)) return {"Settings changed - press Restart to Apply"};
      if (!id(mqtt_enabled).state) return {"Off"};
      if (id(mqtt_broker).state.find_first_not_of(" \t") == std::string::npos) return {"No broker set"};
      if (id(mqtt_client)->is_connected())
        return {"Connected - topics under " + id(mqtt_client)->get_topic_prefix() + "/"};
      return {"Connecting..."};
    filters: *publish_on_change

  - platform: template
    name: "State"
    id: cover_state
    web_server: { sorting_weight: 2, sorting_group_id: group_control }
    update_interval: 500ms
    lambda: |-
      switch (id(global_state)) {
        case 1: return {"OPENING"};
        case 2: return {"CLOSING"};
        case 3: return {"HOMING"};
        default: return {"IDLE"};
      }
    filters: *publish_on_change

  # Makes driver overheating visible. When the TMC2209 overheats it switches the
  # motor off until it cools, but steps keep being counted -- the curtain drifts
  # with no other sign anywhere. "Overheated earlier" persists until home is set
  # (homing, both-buttons, or a Close Overtravel close), since the position may
  # be off until then.
  - platform: template
    name: "Driver Temperature"
    id: drv_temp_status
    icon: "mdi:thermometer-alert"
    entity_category: DIAGNOSTIC
    web_server: { sorting_weight: 3, sorting_group_id: group_diagnostics }
    update_interval: 1s
    lambda: |-
      switch (id(global_drv_temp)) {
        case 2: return {"Overheated - motor shut off"};
        case 1: return {"Hot"};
      }
      if (id(global_drv_ot_latched)) return {"Overheated earlier - re-home"};
      return {"OK"};
    filters: *publish_on_change

# Motion-completion poll: persist position; flip OPENING/CLOSING back to IDLE
# when the stepper reaches target. A close that finishes below 0 just completed
# its overtravel: that spot is the closed end, so re-zero it. A close stopped
# short (button, Stop) never gets here -- stop_action clears global_state -- so
# an interrupted overtravel leaves the position honest rather than zeroed.
# (The sun-schedule poll lives in scheduling.)
interval:
  - interval: 200ms
    then:
      - globals.set:
          id: global_current_position
          value: !lambda "return id(driver)->current_position;"
      - if:
          condition:
            lambda: |-
              int s = id(global_state);
              return (s == 1 || s == 2) &&
                     id(driver)->current_position == id(driver)->target_position;
          then:
            - if:
                condition:
                  lambda: 'return id(global_state) == 2 && id(driver)->target_position < 0;'
                then:
                  - script.execute: set_home_zero
                  - logger.log: "Close overtravel finished — closed end re-zeroed to 0"
                else:
                  - globals.set: { id: global_state, value: "0" }
                  - cover.template.publish: { id: ropener_cover, current_operation: IDLE }
            - globals.set: { id: b1_hold_active, value: "false" }
            - globals.set: { id: b2_hold_active, value: "false" }

  # Driver watch, two parts. (1) Shutdowns, from the sticky GSTAT.drv_err flag,
  # counted exactly once via drv_shutdown_seen. (2) Live temperature from
  # DRV_STATUS for the status text -- polled because the component only reads
  # DRV_STATUS on a driver error, so the prewarning (the useful early sign)
  # would never be seen. A failed UART read returns 0, which reads as OK --
  # never a false alarm.
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t gstat = (uint32_t) id(driver)->read_register(GSTAT);
          if (id(driver)->extract_field(gstat, DRV_ERR_FIELD)) {
            id(drv_shutdown_seen)->execute("poll");
            // Write-1-to-clear this bit only (write_field would read-modify-write
            // and also clear reset/uv_cp). It only clears once the error
            // condition is gone, so it reads 1 again until then -- err_active
            // keeps that from counting twice.
            id(driver)->write_register(GSTAT, DRV_ERR_MASK);
          } else {
            id(global_drv_err_active) = false;
          }

          const uint32_t drv = (uint32_t) id(driver)->read_register(DRV_STATUS);
          int t = 0;
          if (id(driver)->extract_field(drv, OT_FIELD)) t = 2;
          else if (id(driver)->extract_field(drv, OTPW_FIELD)) t = 1;
          if (t != id(global_drv_temp)) {
            // t == 2 isn't logged here: drv_shutdown_seen logs each shutdown once.
            if (t == 1) ESP_LOGW("ropener", "Motor driver hot (~120 C). Lower Motor Current if this keeps happening.");
            else if (t == 0) ESP_LOGI("ropener", "Motor driver temperature back to normal");
            id(global_drv_temp) = t;
          }
          if (t == 2) id(global_drv_ot_latched) = true;
