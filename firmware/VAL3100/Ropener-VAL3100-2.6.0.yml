# =============================================================================
# Ropener — ESPHome firmware
# Version: 2.6.0
# =============================================================================
#
# A Wi-Fi connected curtain/cover controller that pulls a poly rope using a
# TMC2209-driven stepper motor on an ESP32-C6. Control it via a browser at
# http://ropener-XXXXXX.local (where XXXXXX is the last 3 bytes of the
# device's MAC address — printed on the serial log at boot). No Home Assistant
# required. Can also pair with Home Assistant over the native ESPHome API. Supports a 0..1 position
# (closed..open), StallGuard-based auto-homing, and tunable motion/sensorless
# homing parameters.
#
# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
#   MCU     : ESP32-C6 (esp32-c6-devkitc-1, esp-idf framework)
#   Driver  : TMC2209 stepper driver, single-wire UART control (PDN_UART)
#   Motor   : NEMA-17 stepper, 200 full steps/rev, 8x microstepping = 1600 steps/rev
#   Gearing : MK7 drive gear, ~3.7699 cm of rope per revolution
#
# -----------------------------------------------------------------------------
# GPIO wiring (ESP32-C6 -> TMC2209 / buttons)
# -----------------------------------------------------------------------------
#   GPIO0 : UART RX  <- TMC2209 PDN_UART
#   GPIO1 : DIAG   (TMC2209 StallGuard / diagnostic output -> on_stall)
#   GPIO3 : Button 1  (close / home), active-low pushbutton to GND
#   GPIO4 : Button 3  (Wi-Fi reset),  active-low pushbutton to GND
#   GPIO5 : ENN    (TMC2209 enable, active-low)
#   GPIO6 : UART TX  -> TMC2209 PDN_UART
#   GPIO7 : INDEX  (TMC2209 step-counter output, informational)
#   GPIO8 : Button 2  (open),         active-low pushbutton to GND
#
# -----------------------------------------------------------------------------
# Position / motion model
# -----------------------------------------------------------------------------
#   Steps are the canonical position unit. Cover position is derived live:
#
#       position = current_position / global_distance_steps      (0.0 .. 1.0)
#
#   where:
#       global_distance_steps = (distance_cm / gear_distance_cm) * steps_per_revolution
#
#   Defaults give a 30 cm travel window:
#       30 cm / 3.7699 cm/rev * 1600 steps/rev ≈ 12,732 steps
#
#   Position 0 = fully closed (rope home, located by StallGuard).
#   Position 1 = fully open   (target = global_distance_steps).
#
# -----------------------------------------------------------------------------
# Homing
# -----------------------------------------------------------------------------
#   The closed end is found by sensorless StallGuard: the motor drives toward
#   the closed direction until SG_RESULT drops below SGTHRS while the motor is
#   running below TCOOLTHRS, which fires DIAG and triggers the stepper's
#   on_stall handler. That handler stops the motor and zeroes the position.
#
#   Manual re-home (drives motor toward closed end until StallGuard fires):
#     - Tap Button 1 seven times quickly, OR
#     - Press the "Start-Stop Homing" diagnostic button.
#   Homing can be cancelled (stops the motor and zeroes the position) by:
#     - Any press of Button 1 OR Button 2 while HOMING, OR
#     - Pressing the "Start-Stop Homing" button again while HOMING.
#
# -----------------------------------------------------------------------------
# Buttons (physical, on the device)
# -----------------------------------------------------------------------------
#   Safety rules that always win, whatever the gesture:
#     - A press while OPENING/CLOSING stops the motor in place.
#     - A press while HOMING stops the motor and zeroes the position.
#   Holding a button to move only runs while held and the motor auto-stops at
#   the 0 % / 100 % end — it cannot be driven past the limit.
#
#   Button 1 (GPIO3):
#     - Tap (quick press/release)   : close cover (to 0 %)
#     - Press and hold              : close while held; auto-stops at 0 %, and
#                                     stops early on release (hold-to-run)
#     - Seven quick taps            : start homing
#   Button 2 (GPIO8):
#     - Tap (quick press/release)   : open cover (to 100 %)
#     - Press and hold              : open while held; auto-stops at 100 %, and
#                                     stops early on release (hold-to-run)
#   Button 1 + Button 2 together:
#     - Hold both for 3 s           : set the current position as home (0)
#   Button 3 (GPIO4):
#     - Long  press (3 s - 10 s)    : clear saved Wi-Fi credentials + reboot
#
# -----------------------------------------------------------------------------
# Daily schedule (browser-editable, no Home Assistant required)
# -----------------------------------------------------------------------------
#   Open the web UI and set:
#     - "Open Time"  / "Close Time" : daily times to open / close the cover
#     - "Schedule Enabled"          : master on/off for the schedule
#     - "Timezone"                  : POSIX TZ string for your region
#   With the schedule enabled, the cover opens at Open Time and closes at Close
#   Time every day (skipped while homing). All four settings persist across
#   reboots. Requires the device to have a network connection for SNTP time.
#
# -----------------------------------------------------------------------------
# Wi-Fi provisioning (no secrets required)
# -----------------------------------------------------------------------------
#   This firmware ships without hardcoded Wi-Fi credentials. On first boot (or
#   after a Wi-Fi reset) connect to the "ropener-XXXXXX" hotspot and use the
#   captive portal to enter your network — or push credentials over USB serial
#   with Improv (e.g. web.esphome.io). Credentials are stored in flash and
#   survive reboots and OTA updates.
#
#   secrets.yaml is only needed if you enable the optional native-API
#   encryption key (api_key) — see the Home Assistant pairing note below.
#
# Non-HA users: open http://ropener-XXXXXX.local in a browser to
# control the device (replace XXXXXX with the MAC suffix from the serial log).
#
# -----------------------------------------------------------------------------
# Home Assistant pairing note
# -----------------------------------------------------------------------------
# The native API runs without encryption by default. Home Assistant will show
# a warning when you first add the device ("Communication not encrypted").
# The device works normally despite this warning. To silence it, generate an
# encryption key and add it to secrets.yaml, then uncomment the encryption
# block in the `api:` section below:
#
#   api:
#     encryption:
#       key: !secret api_key          # 32-byte base64 string
#
# Generate a key with: python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
# =============================================================================

# External TMC2209 component family by @slimcdk. Provides UART register access,
# StallGuard configuration, and the tmc2209 stepper platform used below.
external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [tmc2209_hub, tmc2209, stepper]

# -----------------------------------------------------------------------------
# Persistent state
# -----------------------------------------------------------------------------
# All globals use restore_value so settings survive reboots. They are mirrored
# by `number` / `switch` entities further down — editing in Home Assistant
# updates the global AND pushes the value to the appropriate TMC2209 register.
globals:
  # Motor run current (TMC2209 IRUN field, 0-31). Higher = more torque + heat.
  # 25 is a moderate setting; reduce if the driver overheats or skips cooldown.
  - id: global_irun
    type: int
    restore_value: yes
    initial_value: '25'

  # Stepper target speed (steps/second). Capped by stepper.max_speed below.
  - id: global_speed
    type: int
    restore_value: yes
    initial_value: '1500'

  # Stepper acceleration (steps/s^2). Used at both ramp-up and ramp-down.
  - id: global_acceleration
    type: int
    restore_value: yes
    initial_value: '1500'

  # TCOOLTHRS — TSTEP threshold below which StallGuard / CoolStep are active
  # (i.e., motor must be moving fast enough). Lower TCOOLTHRS = StallGuard
  # only at higher speeds. Range 0..1048575.
  - id: global_tcoolthrs
    type: int
    restore_value: yes
    initial_value: '0'

  # SGTHRS — StallGuard threshold (0..255). The motor is considered stalled
  # when SG_RESULT < 2*SGTHRS. Higher = more sensitive (false-stalls easier).
  - id: global_sgthrs
    type: int
    restore_value: yes
    initial_value: '0'

  # Configured travel distance, in centimeters of rope. Source of truth for
  # `global_distance_steps`; recomputed whenever the user updates it.
  - id: global_distance_cm
    type: int
    restore_value: yes
    initial_value: '30'

  # Configured travel distance, expressed in motor steps. Derived from
  # global_distance_cm (the single source of truth) by the `recompute_distance`
  # script, which runs on boot and whenever Centimeters changes — so this can
  # never drift out of sync with cm. NOT persisted: it's a cache, not a
  # setting. This is the "100%" target that the cover entity uses to map
  # position 1.0 -> step count.
  - id: global_distance_steps
    type: int
    restore_value: no
    initial_value: '12732'

  # Motor shaft direction. Persisted so the unit comes up the same way after
  # a reboot. Toggled by the "Motor Direction" switch entity.
  - id: global_stepper_direction
    type: esphome::tmc2209::ShaftDirection
    restore_value: yes
    initial_value: 'esphome::tmc2209::ShaftDirection::CLOCKWISE'

  # Cover state machine. Not persisted — every reboot starts IDLE, since the
  # motor is not actually moving at that point.
  #   0 = IDLE     no motion in progress
  #   1 = OPENING  driving toward global_distance_steps
  #   2 = CLOSING  driving toward 0
  #   3 = HOMING   driving toward a sentinel target, waiting for StallGuard
  # Mirrored to HA via the "State" text_sensor. Transitions back to IDLE:
  #   OPENING/CLOSING  -> polling interval sees current_position == target
  #   HOMING           -> on_stall (real stall) OR any button press (cancel)
  - id: global_state
    type: int
    restore_value: no
    initial_value: '0'

  # Last known stepper position in steps. Persisted so the cover entity
  # survives reboots without needing an immediate re-home. Saved every 200 ms
  # by the motion-completion poll and restored in on_boot.
  - id: global_current_position
    type: int
    restore_value: yes
    initial_value: '0'

  # Geographic location for the sunrise/sunset schedule, in decimal degrees
  # (north and east positive). Persisted and browser-editable via the
  # "Latitude"/"Longitude" numbers; pushed into the sun component on change and
  # on boot. Default 0,0 — set your real coordinates for the sun schedule to be
  # meaningful.
  - id: global_latitude
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: global_longitude
    type: float
    restore_value: yes
    initial_value: '0.0'

  # Minute offsets applied to the sun events: the cover opens at
  # sunrise + open_offset and closes at sunset + close_offset. Signed, so a
  # negative value fires before the event (e.g. "close 30 min before sunset" is
  # a close offset of -30). Persisted and browser-editable.
  - id: global_sun_open_offset
    type: int
    restore_value: yes
    initial_value: '0'

  - id: global_sun_close_offset
    type: int
    restore_value: yes
    initial_value: '0'

  # Last daylight state the sun scheduler drove the cover to (1 = open/day,
  # 0 = closed/night, -1 = not yet evaluated). The scheduler only issues a move
  # when this changes, so it acts once per sunrise/sunset transition (and
  # reconciles to the correct state on boot) without repeatedly fighting manual
  # control. Reset to -1 whenever the schedule mode or its inputs change. Not
  # persisted: every boot re-evaluates from the current time.
  - id: global_sun_last_desired
    type: int
    restore_value: no
    initial_value: '-1'

  # --- Physical-button gesture state (runtime only, never persisted) ---
  # Live pressed-state of each front button, kept current by on_press/on_release
  # so a gesture handler can ask "is the other button also down?".
  - id: b1_down
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: b2_down
    type: bool
    restore_value: no
    initial_value: 'false'

  # True while a button's hold-to-run is engaged (B1 = closing, B2 = opening).
  # Releasing the button while this is set stops the motor.
  - id: b1_hold_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: b2_hold_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # Set when a press was already acted on at press-time (stop / homing-cancel /
  # set-home combo / hold engage) so its release does nothing further.
  - id: b1_consumed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: b2_consumed
    type: bool
    restore_value: no
    initial_value: 'false'

  # Rapid-tap counter for the Button 1 "7 quick taps -> start homing" gesture,
  # plus the millis() timestamp of the last tap used to reset a stale chain.
  - id: b1_tap_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: b1_last_tap_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# -----------------------------------------------------------------------------
# Derived-value recompute
# -----------------------------------------------------------------------------
# global_distance_cm is the single persisted source of truth for travel
# distance. global_distance_steps is a derived cache; this script recomputes it
# from cm using the formula in exactly ONE place. It is run on boot (to resync
# the cache from the restored cm) and whenever the Centimeters number changes,
# so the two can never drift apart.
#   steps = (cm / gear_distance_cm) * steps_per_revolution
# The float cast keeps fractional revolutions from being truncated before the
# steps multiplication. The script has no delays, so script.execute runs it
# synchronously.
script:
  - id: recompute_distance
    then:
      - globals.set:
          id: global_distance_steps
          value: !lambda "return (float(id(global_distance_cm)) / ${gear_distance_cm}) * ${steps_per_revolution};"

  # ---------------------------------------------------------------------------
  # Physical-button helpers
  # ---------------------------------------------------------------------------
  # The two front buttons drive several overlapping gestures (tap, hold-to-run,
  # the 7-tap homing trigger and the two-button "set home" combo). To keep the
  # motor from lurching while a gesture is still being classified, each press is
  # sorted out in the binary_sensor on_press/on_release handlers (further down)
  # and the resulting motion is funnelled through these named scripts.

  # Begin sensorless homing: drive toward the closed end until StallGuard fires
  # (caught by the stepper's on_stall handler, which zeroes the position).
  # -100000 is a "go forever" sentinel well past the longest possible travel.
  - id: start_homing
    then:
      - globals.set:
          id: global_state
          value: "3"
      - cover.template.publish:
          id: ropener_cover
          current_operation: CLOSING
      - stepper.report_position:
          id: driver
          position: 0
      - stepper.set_target:
          id: driver
          target: -100000
      - logger.log: "Starting homing"

  # Declare the current position as home (0): halt, zero the step counter and
  # return to IDLE. Used by the two-button combo and to cancel a homing run.
  - id: set_home_zero
    then:
      - stepper.stop: driver
      - stepper.report_position:
          id: driver
          position: 0
      - stepper.set_target:
          id: driver
          target: 0
      - globals.set:
          id: global_state
          value: "0"
      - cover.template.publish:
          id: ropener_cover
          current_operation: IDLE
      - logger.log: "Home position set to 0"

  # Hold-to-run engage. Armed on press, fired after hold_run_ms; only engages if
  # the button is still held ALONE from IDLE, so a quick tap or the two-button
  # combo never trips it. restart mode so a fresh press re-arms the timer.
  # cover.close / cover.open target the configured ends (0 % / 100 %), so the
  # motor stops at the limit and can never run past it — holding only governs
  # stopping EARLY, on release (handled in on_release).
  - id: b1_hold_check
    mode: restart
    then:
      - delay: ${hold_run_ms}ms
      - if:
          condition:
            lambda: 'return id(b1_down) && !id(b2_down) && id(global_state) == 0 && id(b1_tap_count) < 7;'
          then:
            - globals.set:
                id: b1_hold_active
                value: "true"
            - globals.set:
                id: b1_consumed
                value: "true"
            - cover.close: ropener_cover
            - logger.log: "Button 1 held: closing while held"
  - id: b2_hold_check
    mode: restart
    then:
      - delay: ${hold_run_ms}ms
      - if:
          condition:
            lambda: 'return id(b2_down) && !id(b1_down) && id(global_state) == 0;'
          then:
            - globals.set:
                id: b2_hold_active
                value: "true"
            - globals.set:
                id: b2_consumed
                value: "true"
            - cover.open: ropener_cover
            - logger.log: "Button 2 held: opening while held"

  # Single-tap close for Button 1. Deferred by tap_window_ms after release so a
  # rapid burst (the 7-tap homing gesture) can chain without the motor moving
  # between taps; each new press cancels the pending commit. Commits the close
  # only if we are still IDLE and the burst never reached 7. Always clears the
  # tap counter so the next press starts a fresh chain.
  - id: b1_tap_commit
    mode: restart
    then:
      - delay: ${tap_window_ms}ms
      - if:
          condition:
            lambda: 'return id(global_state) == 0 && id(b1_tap_count) < 7;'
          then:
            - cover.close: ropener_cover
            - logger.log: "Button 1 tap: closing"
      - globals.set:
          id: b1_tap_count
          value: "0"

  # Two-button "set home" combo: armed whenever both buttons are down, fired
  # after combo_home_ms. If both are still held, zero the position. restart mode
  # keeps the latest both-down moment as the start of the window.
  - id: combo_home
    mode: restart
    then:
      - delay: ${combo_home_ms}ms
      - if:
          condition:
            lambda: 'return id(b1_down) && id(b2_down);'
          then:
            - script.execute: set_home_zero
            - globals.set:
                id: b1_consumed
                value: "true"
            - globals.set:
                id: b2_consumed
                value: "true"
            - globals.set:
                id: b1_tap_count
                value: "0"
            - logger.log: "Both buttons held: home position set"

# -----------------------------------------------------------------------------
# Mechanical constants
# -----------------------------------------------------------------------------
# These are compile-time substitutions (not runtime-tunable). Change them only
# if the gear or microstepping changes; a new flash is required.
substitutions:
  # Linear travel per motor revolution. MK7 drive gear: π * 1.2 cm pitch dia.
  gear_distance_cm: "3.7699"

  # Steps per motor revolution = 200 full steps * 8 microsteps. Must match the
  # `microsteps:` value passed to tmc2209.configure in on_boot.
  steps_per_revolution: "1600"

  # Firmware version — single source of truth. Feeds project.version (below) and
  # the "Firmware Version" diagnostic sensor shown on the web UI / in HA.
  firmware_version: "2.6.0"

  # Physical-button gesture timing (ms). Compile-time, not runtime-tunable.
  #   hold_run_ms  : a press held longer than this engages hold-to-run; shorter
  #                  is treated as a tap. Long enough that a deliberate tap is
  #                  never mistaken for a hold.
  #   tap_window_ms: rapid taps must arrive within this gap of each other to
  #                  chain toward the 7-tap homing gesture; it also defers the
  #                  single-tap close by this long so a burst can complete
  #                  without the motor twitching between taps.
  #   combo_home_ms: both buttons must be held together this long to set home.
  hold_run_ms: "700"
  tap_window_ms: "400"
  combo_home_ms: "3000"

# -----------------------------------------------------------------------------
# Native ESPHome API (Home Assistant integration)
# -----------------------------------------------------------------------------
# Enables pairing with Home Assistant. Non-HA users can leave this as-is —
# it has no effect without an HA instance on the network.
# Optional: add encryption by appending:
#   encryption:
#     key: !secret api_key
api:

# Over-the-air firmware updates. The `esphome` platform handles uploads from the
# ESPHome dashboard / CLI; the `http_request` platform powers the "Update
# Firmware (GitHub)" button, which pulls the latest released binary from GitHub.
ota:
  - platform: esphome
  - platform: http_request

# HTTP client used by the GitHub OTA button. verify_ssl is off so we don't have
# to bundle and refresh a CA certificate; the tradeoff is no certificate
# verification on the download. The timeout is generous (the image is ~1 MB).
http_request:
  verify_ssl: false
  timeout: 10min

# UART logger. By default ESPHome logs one DEBUG line per entity publish, so
# the chatty `number` / `text_sensor` / `sensor` entities (which re-publish on
# every update_interval) flood the log even while idle. Keep the global level
# at DEBUG so device events still show (homing, the sun schedule, Wi-Fi), but
# raise those three publish-heavy tags to INFO to hide their routine updates.
# The live values are still visible in the web UI / Home Assistant — only the
# log spam is suppressed. To watch SG_RESULT in the log while tuning StallGuard,
# set `sensor: DEBUG` here (or remove that line).
logger:
  logs:
    number: INFO
    text_sensor: INFO
    sensor: INFO

# Browser-based control panel — open http://ropener.local in any
# browser on the same network. Exposes all entities (cover, buttons, numbers,
# switches, sensors) without requiring Home Assistant.
#
# version: 3 enables the grouped UI: instead of one alphabetical list, entities
# are placed into the labeled, collapsible groups defined below. Each entity
# sets `web_server: { sorting_weight, sorting_group_id }` to choose its group
# and position within it; the groups themselves are ordered by their own
# sorting_weight (lower = higher on the page).
web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: group_control
      name: "Control"
      sorting_weight: 10
    - id: group_setup
      name: "Setup"
      sorting_weight: 20
    - id: group_schedule
      name: "Schedule"
      sorting_weight: 30
    - id: group_motion
      name: "Motion Tuning"
      sorting_weight: 40
    - id: group_stallguard
      name: "StallGuard / Homing"
      sorting_weight: 50
    - id: group_diagnostics
      name: "Diagnostics"
      sorting_weight: 60

# -----------------------------------------------------------------------------
# Board / Wi-Fi
# -----------------------------------------------------------------------------
esp32:
  variant: esp32c6
  framework:
    type: esp-idf

# This firmware ships WITHOUT hardcoded Wi-Fi credentials so each unit can be
# provisioned to its owner's network — no secrets are baked into the binary.
# On a fresh flash (or after a Wi-Fi reset) the device has no saved network and
# comes up in setup mode: it broadcasts a "ropener-XXXXXX" hotspot (same name as
# its mDNS hostname, where XXXXXX is the last 3 bytes of the MAC). Connect to it
# and the captive portal lets you enter credentials; Improv over USB serial
# works too. Credentials are saved to flash and survive reboots and OTA updates.
wifi:
  # No STA `ssid:`/`password:` here on purpose (see above): credentials come
  # from the captive portal or Improv and are stored in flash. ESPHome keeps
  # flash-saved credentials as long as none are set in the config file.
  #
  # No `ssid:` under `ap:` on purpose either: ESPHome's wifi component defaults
  # the fallback-hotspot SSID to App.get_name(), which with name_add_mac_suffix
  # is "ropener-XXXXXX" — unique per device and matched to the .local hostname.
  # (See setup_ap_config_() in wifi_component.cpp.)
  ap:

captive_portal:

# Improv Wi-Fi provisioning over USB serial — lets tools like web.esphome.io
# push Wi-Fi credentials without editing secrets.yaml or using the hotspot.
# Note: unlike the ESP32-C3, the ESP32-C6 has Bluetooth LE, so esp32_improv
# (BLE provisioning) is also available here if desired — serial is kept for
# simplicity and because it needs no extra app.
improv_serial:

# -----------------------------------------------------------------------------
# Time source (drives the open/close schedule)
# -----------------------------------------------------------------------------
# SNTP keeps the clock synced over the network. SNTP time is UTC; the local
# time the schedule fires on is derived from the timezone. We pin a deterministic
# "UTC0" default here (rather than letting ESPHome bake in the build machine's
# timezone) so every shipped unit behaves identically — each user then sets
# their own zone at runtime via the "Timezone" text entity, no reflash needed.
# Setting `timezone:` also enables USE_TIME_TIMEZONE so set_timezone() compiles.
time:
  - platform: sntp
    id: sntp_time
    timezone: "UTC0"

# -----------------------------------------------------------------------------
# Sun position (drives the optional sunrise/sunset schedule)
# -----------------------------------------------------------------------------
# Computes local sunrise/sunset from the device's latitude/longitude and the
# SNTP clock above. The lat/long literals here are placeholders (0,0 — "null
# island"); the real location is pushed in at runtime from the browser-editable
# "Latitude"/"Longitude" numbers (and re-applied in on_boot), so no reflash is
# needed to set your location. Consumed by the sun-schedule interval further
# down when "Sun Schedule" is enabled. The time source is auto-resolved to the
# single `time:` component above.
sun:
  id: sun_sun
  latitude: 0°
  longitude: 0°

# -----------------------------------------------------------------------------
# Device identity + boot-time motor configuration
# -----------------------------------------------------------------------------
# on_boot restores the persisted globals into the TMC2209 driver and stepper
# component every power cycle. Order matters:
#   1. configure direction + microstepping + TCOOLTHRS
#   2. arm StallGuard at the saved SGTHRS
#   3. apply currents (IRUN, freewheel-on-idle so the rope can hand-pull)
#   4. apply speed and acceleration
esphome:
  name: ropener
  name_add_mac_suffix: true          # makes every unit unique, e.g. ropener-a1b2c3
  friendly_name: "Ropener Curtain"
  # Project identity + firmware version. Surfaced in Home Assistant device info
  # and the ESPHome dashboard, and exposed over the native API so HA can tell
  # which build is running. Bump `version` on every released change.
  project:
    name: "valar-systems.ropener"
    version: "${firmware_version}"
  on_boot:
    - script.execute: recompute_distance     # resync derived step count from the persisted cm
    - tmc2209.configure:
        direction: !lambda return id(global_stepper_direction);
        microsteps: 8                                          # must match steps_per_revolution
        interpolation: true                                    # smoother motion (256-microstep interp)
        tcool_threshold: !lambda "return id(global_tcoolthrs);"
    - tmc2209.stallguard:
        threshold: !lambda "return id(global_sgthrs);"
    - tmc2209.currents:
        standstill_mode: freewheeling                          # release motor when idle (manual-pull friendly)
        irun: !lambda "return id(global_irun);"
        ihold: 0                                               # no holding current (combined with freewheel)
        tpowerdown: 0
        iholddelay: 0
    - stepper.set_speed:
        id: driver
        speed: !lambda "return id(global_speed);"
    - stepper.set_acceleration:
        id: driver
        acceleration: !lambda "return id(global_acceleration);"
    - stepper.report_position:             # restore last known position so HA cover is accurate
        id: driver
        position: !lambda "return id(global_current_position);"
    - stepper.set_target:                  # park target at the restored position (no unwanted motion)
        id: driver
        target: !lambda "return id(global_current_position);"
    - lambda: |-
        // Re-apply the timezone the user picked in the browser. The Timezone
        // text entity restores its saved value during setup, but restoring a
        // value does not re-fire its set_action, so we push it into the clock
        // here on boot. (Runs after component setup, like the stepper restore
        // above, which also relies on restored state.)
        id(sntp_time)->set_timezone(id(tz_text)->state);
    - lambda: |-
        // Same story for the saved location: the Latitude/Longitude numbers
        // restore their values but don't re-fire their set_action, so push
        // them into the sun component here so sunrise/sunset are computed for
        // the right place after a reboot.
        id(sun_sun)->set_latitude(id(global_latitude));
        id(sun_sun)->set_longitude(id(global_longitude));
    - text_sensor.template.publish:        # surface the firmware version on the web UI / HA
        id: firmware_version_text
        state: "${firmware_version}"

# -----------------------------------------------------------------------------
# UART to TMC2209 (PDN_UART, single-wire)
# -----------------------------------------------------------------------------
# 500 kbaud is well within the TMC2209's tolerance and gives quick register
# round-trips for the 1 s polled diagnostic sensors.
uart:
  tx_pin: 6
  rx_pin: 0
  baud_rate: 500000

# -----------------------------------------------------------------------------
# Stepper driver
# -----------------------------------------------------------------------------
# rsense 100 mOhm + vsense=false matches the VAL3000 module.
# Adjust rsense if your board uses a different sense resistor.
# The on_stall handler implements sensorless homing: when StallGuard fires we
# stop the motor and treat the current position as 0 (closed end).
stepper:
  - platform: tmc2209
    id: driver
    max_speed: 2000 steps/s                # ceiling enforced by the stepper component (faster = louder)
    acceleration: 2000 steps/s^2           # default acceleration (overridden at boot from global_acceleration)
    deceleration: 3000 steps/s^2           # asymmetric: brake faster than we ramp up
    config_dump_include_registers: false    # dump TMC2209 registers in the boot log for debugging
    rsense: 100 mOhm
    vsense: False
    enn_pin: 5                             # active-low driver enable
    index_pin: 7                           # step-counter feedback (unused but wired)
    diag_pin: 1                            # StallGuard / fault output -> on_stall
    on_stall:
      - stepper.stop: driver               # halt motion immediately
      - if:
          condition:
            lambda: 'return id(global_state) == 3;'
          then:
            - stepper.report_position:     # treat the stall point as the closed end
                id: driver
                position: 0
            - stepper.set_target:          # park target at 0 so we don't immediately retry
                id: driver
                target: 0
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE
            - logger.log: "Homed cover"
          else:
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE
            - logger.log: "Stall detected outside homing — motor stopped, position unchanged"

# -----------------------------------------------------------------------------
# Physical buttons
# -----------------------------------------------------------------------------
# Both buttons are wired to GND through their pin (active-low) and use a 10 ms
# debounce filter. Each press is classified in on_press/on_release rather than
# acted on immediately, so the overlapping gestures (tap, hold-to-run, the
# 7-tap homing trigger and the two-button "set home" combo) never make the
# motor lurch mid-gesture. The resulting motion is funnelled through the
# "Physical-button helpers" scripts defined earlier. Safety rules that always
# win: a press while OPENING/CLOSING stops the motor in place, and a press
# while HOMING stops it and zeroes the position. Gesture map:
#   Button 1  tap            -> close to 0 %
#   Button 1  hold           -> close while held (auto-stops at 0 %)
#   Button 1  x7 quick taps  -> start homing
#   Button 2  tap            -> open to 100 %
#   Button 2  hold           -> open while held (auto-stops at 100 %)
#   Button 1 + 2 held 3 s    -> set current position as home (0)
binary_sensor:
  - platform: gpio
    name: Button 1
    web_server:
      sorting_weight: 1
      sorting_group_id: group_diagnostics
    id: btn1
    pin:
      number: 3
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 10ms
    # Button 1 (close / homing). on_press sorts the press by motion state and by
    # whether Button 2 is also down; on_release ends a hold-to-run or commits a
    # deferred tap. See the "Physical-button helpers" scripts above.
    on_press:
      - globals.set:
          id: b1_down
          value: "true"
      - if:
          # HOMING -> any button press stops the motor and zeroes the position.
          condition:
            lambda: 'return id(global_state) == 3;'
          then:
            - script.stop: b1_hold_check
            - script.stop: b1_tap_commit
            - script.execute: set_home_zero
            - globals.set:
                id: b1_consumed
                value: "true"
            - globals.set:
                id: b1_tap_count
                value: "0"
            - logger.log: "Homing cancelled (Button 1)"
          else:
            - if:
                # OPENING/CLOSING -> any press stops the motor in place.
                condition:
                  lambda: 'return id(global_state) == 1 || id(global_state) == 2;'
                then:
                  - script.stop: b1_hold_check
                  - script.stop: b1_tap_commit
                  - cover.stop: ropener_cover
                  - globals.set:
                      id: b1_consumed
                      value: "true"
                  - globals.set:
                      id: b1_tap_count
                      value: "0"
                else:
                  - if:
                      # Both buttons down -> arm the "set home" combo, motor still.
                      condition:
                        lambda: 'return id(b2_down);'
                      then:
                        - script.stop: b1_hold_check
                        - script.stop: b2_hold_check
                        - script.stop: b1_tap_commit
                        - cover.stop: ropener_cover
                        - globals.set:
                            id: b1_hold_active
                            value: "false"
                        - globals.set:
                            id: b2_hold_active
                            value: "false"
                        - globals.set:
                            id: b1_consumed
                            value: "true"
                        - globals.set:
                            id: b2_consumed
                            value: "true"
                        - script.execute: combo_home
                      else:
                        # IDLE, single button: count toward the 7-tap homing
                        # gesture, then either start homing or arm hold-to-run.
                        - script.stop: b1_tap_commit
                        - lambda: |-
                            uint32_t now = millis();
                            if (now - id(b1_last_tap_ms) > ${tap_window_ms}) id(b1_tap_count) = 0;
                            id(b1_tap_count) += 1;
                            id(b1_last_tap_ms) = now;
                        - globals.set:
                            id: b1_consumed
                            value: "false"
                        - if:
                            condition:
                              lambda: 'return id(b1_tap_count) >= 7;'
                            then:
                              - script.stop: b1_hold_check
                              - globals.set:
                                  id: b1_tap_count
                                  value: "0"
                              - globals.set:
                                  id: b1_consumed
                                  value: "true"
                              - script.execute: start_homing
                              - logger.log: "Button 1 x7: starting homing"
                            else:
                              - script.execute: b1_hold_check
    on_release:
      - globals.set:
          id: b1_down
          value: "false"
      - script.stop: b1_hold_check     # released before hold engaged -> no hold
      - script.stop: combo_home        # both no longer held -> abort combo
      - if:
          condition:
            lambda: 'return id(b1_hold_active);'
          then:
            # Hold-to-run was running -> stop where it is.
            - cover.stop: ropener_cover
            - globals.set:
                id: b1_hold_active
                value: "false"
            - globals.set:
                id: b1_consumed
                value: "false"
            - logger.log: "Button 1 released: stopped"
          else:
            - if:
                # Already handled at press-time (stop / cancel / combo): do nothing.
                condition:
                  lambda: 'return id(b1_consumed);'
                then:
                  - globals.set:
                      id: b1_consumed
                      value: "false"
                else:
                  # Candidate tap -> commit after the window unless a burst chains on.
                  - script.execute: b1_tap_commit

  - platform: gpio
    name: Button 2
    web_server:
      sorting_weight: 2
      sorting_group_id: group_diagnostics
    id: btn2
    pin:
      number: 8
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 10ms
    # Button 2 (open). Same press classification as Button 1, minus the 7-tap
    # homing gesture, so a tap can open immediately on release.
    on_press:
      - globals.set:
          id: b2_down
          value: "true"
      - if:
          # HOMING -> any button press stops the motor and zeroes the position.
          condition:
            lambda: 'return id(global_state) == 3;'
          then:
            - script.stop: b2_hold_check
            - script.execute: set_home_zero
            - globals.set:
                id: b2_consumed
                value: "true"
            - logger.log: "Homing cancelled (Button 2)"
          else:
            - if:
                # OPENING/CLOSING -> any press stops the motor in place.
                condition:
                  lambda: 'return id(global_state) == 1 || id(global_state) == 2;'
                then:
                  - script.stop: b2_hold_check
                  - cover.stop: ropener_cover
                  - globals.set:
                      id: b2_consumed
                      value: "true"
                else:
                  - if:
                      # Both buttons down -> arm the "set home" combo, motor still.
                      condition:
                        lambda: 'return id(b1_down);'
                      then:
                        - script.stop: b1_hold_check
                        - script.stop: b2_hold_check
                        - script.stop: b1_tap_commit
                        - cover.stop: ropener_cover
                        - globals.set:
                            id: b1_hold_active
                            value: "false"
                        - globals.set:
                            id: b2_hold_active
                            value: "false"
                        - globals.set:
                            id: b1_consumed
                            value: "true"
                        - globals.set:
                            id: b2_consumed
                            value: "true"
                        - globals.set:
                            id: b1_tap_count
                            value: "0"
                        - script.execute: combo_home
                      else:
                        # IDLE, single button: arm hold-to-run (open while held).
                        - globals.set:
                            id: b2_consumed
                            value: "false"
                        - script.execute: b2_hold_check
    on_release:
      - globals.set:
          id: b2_down
          value: "false"
      - script.stop: b2_hold_check     # released before hold engaged -> no hold
      - script.stop: combo_home        # both no longer held -> abort combo
      - if:
          condition:
            lambda: 'return id(b2_hold_active);'
          then:
            # Hold-to-run was running -> stop where it is.
            - cover.stop: ropener_cover
            - globals.set:
                id: b2_hold_active
                value: "false"
            - globals.set:
                id: b2_consumed
                value: "false"
            - logger.log: "Button 2 released: stopped"
          else:
            - if:
                # Already handled at press-time (stop / cancel / combo): do nothing.
                condition:
                  lambda: 'return id(b2_consumed);'
                then:
                  - globals.set:
                      id: b2_consumed
                      value: "false"
                else:
                  # Quick tap -> open the cover (full travel to 100 %).
                  - cover.open: ropener_cover
                  - logger.log: "Button 2 tap: opening"

  # Button 3 (GPIO4): Wi-Fi reset.
  # Hold 3-10 s to erase the saved Wi-Fi credentials and reboot. A long hold
  # is required (not a quick tap) so the device can't be knocked offline by an
  # accidental press. On reboot the device re-runs Wi-Fi setup: with no
  # credentials saved (and none compiled into the firmware), it broadcasts the
  # "ropener-XXXXXX" hotspot / captive portal so a new network can be entered
  # (Improv over USB serial works too).
  - platform: gpio
    name: WiFi Reset
    web_server:
      sorting_weight: 3
      sorting_group_id: group_diagnostics
    id: btn_wifi_reset
    pin:
      number: 4
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 10ms
    on_click:
      - min_length: 3000ms
        max_length: 10000ms
        then:
          - logger.log: "Clearing saved Wi-Fi credentials and rebooting into setup"
          - lambda: |-
              // Overwrite the persisted credentials in flash with empty values,
              // then drop the in-memory copy so nothing is re-saved on teardown.
              esphome::wifi::global_wifi_component->save_wifi_sta("", "");
              esphome::wifi::global_wifi_component->clear_sta();
          - delay: 1s                          # let the log flush before we restart
          - lambda: "App.safe_reboot();"

# -----------------------------------------------------------------------------
# The cover entity (Home Assistant)
# -----------------------------------------------------------------------------
# Template cover backed by the TMC2209 stepper. Position is reported live as a
# 0..1 ratio of current_position / global_distance_steps.
#   - open_action     : drive to the configured travel limit (position 1.0)
#   - close_action    : drive to step 0 (position 0.0; closed end)
#   - position_action : drive to an arbitrary fraction set from HA
#   - stop_action     : halt without changing the target
#
# Each motion action publishes the cover's `current_operation` (OPENING /
# CLOSING / IDLE) so HA's on_opening / on_opened / on_closing / on_closed
# triggers fire. The "Motion-completion poll" interval flips current_operation
# back to IDLE once the stepper reaches its target.
cover:
  - platform: template
    id: ropener_cover
    name: Ropener
    web_server:
      sorting_weight: 1
      sorting_group_id: group_control
    has_position: true
    assumed_state: false
    lambda: "return float(id(driver)->current_position) / float(id(global_distance_steps));"
    stop_action:
      - stepper.stop: driver
      - globals.set:
          id: global_state
          value: "0"
      - cover.template.publish:
          id: ropener_cover
          current_operation: IDLE
    open_action:
      - globals.set:
          id: global_state
          value: "1"
      - cover.template.publish:
          id: ropener_cover
          current_operation: OPENING
      - stepper.set_target:
          id: driver
          target: !lambda return id(global_distance_steps);
    close_action:
      - globals.set:
          id: global_state
          value: "2"
      - cover.template.publish:
          id: ropener_cover
          current_operation: CLOSING
      - stepper.set_target:
          id: driver
          target: 0
    position_action:
      # `pos` is the 0..1 target from HA. We map it onto the configured
      # step range to get an absolute step target for the stepper.
      # Direction is inferred by comparing the new target to current_position.
      - if:
          condition:
            lambda: 'return (pos * id(global_distance_steps)) >= id(driver)->current_position;'
          then:
            - globals.set:
                id: global_state
                value: "1"
            - cover.template.publish:
                id: ropener_cover
                current_operation: OPENING
          else:
            - globals.set:
                id: global_state
                value: "2"
            - cover.template.publish:
                id: ropener_cover
                current_operation: CLOSING
      - stepper.set_target:
          id: driver
          target: !lambda return pos * id(global_distance_steps);

# -----------------------------------------------------------------------------
# Diagnostic / homing buttons (exposed in HA under Diagnostic)
# -----------------------------------------------------------------------------
button:
  # Begin sensorless homing: drive far in the closing direction so StallGuard
  # can locate the closed end. The on_stall handler on the stepper will catch
  # the impact and zero the position. -100000 is just a "go forever" sentinel;
  # pick a target well past the longest possible rope travel.
  # (Same effect as tapping Button 1 seven times quickly.)
  # While HOMING, pressing this button instead stops the motor and zeroes the position.
  - platform: template
    name: "Start-Stop Homing"
    web_server:
      sorting_weight: 3
      sorting_group_id: group_control
    entity_category: DIAGNOSTIC
    on_press:
      - if:
          condition:
            lambda: 'return id(global_state) == 3;'
          then:
            - stepper.stop: driver
            - stepper.report_position:
                id: driver
                position: 0
            - stepper.set_target:
                id: driver
                target: 0
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE
          else:
            - globals.set:
                id: global_state
                value: "3"
            - cover.template.publish:
                id: ropener_cover
                current_operation: CLOSING
            - stepper.report_position:
                id: driver
                position: 0
            - stepper.set_target:
                id: driver
                target: -100000

  # Pull the latest released firmware for this model straight from GitHub and
  # flash it over the air. Points at the version-less "latest" asset so the URL
  # never changes between releases; the device downloads, flashes, and reboots.
  - platform: template
    name: "Update Firmware (GitHub)"
    web_server:
      sorting_weight: 5
      sorting_group_id: group_diagnostics
    entity_category: DIAGNOSTIC
    on_press:
      - logger.log: "Checking GitHub for the latest firmware..."
      - ota.http_request.flash:
          # Version-less "latest" assets (published with every release): the OTA
          # image plus a text file holding its MD5, which the flash verifies.
          md5_url: https://github.com/Valar-Systems/Ropener/releases/latest/download/Ropener-VAL3100.ota.bin.md5
          url: https://github.com/Valar-Systems/Ropener/releases/latest/download/Ropener-VAL3100.ota.bin


# -----------------------------------------------------------------------------
# Configuration switches
# -----------------------------------------------------------------------------
# Motor Direction: flips the shaft direction so the same close/open commands
# wind the rope the right way regardless of how the motor was mounted.
#   OFF -> CLOCKWISE
#   ON  -> COUNTERCLOCKWISE
# `optimistic: true` is fine here because the action is idempotent and we
# persist the truth in `global_stepper_direction`.
switch:
  - platform: template
    name: "Motor Direction"
    web_server:
      sorting_weight: 2
      sorting_group_id: group_setup
    entity_category: CONFIG
    optimistic: true
    turn_on_action:
      - globals.set:
          id: global_stepper_direction
          value: 'esphome::tmc2209::ShaftDirection::COUNTERCLOCKWISE'
      - tmc2209.configure:
          direction: !lambda return id(global_stepper_direction);
    turn_off_action:
      - globals.set:
          id: global_stepper_direction
          value: 'esphome::tmc2209::ShaftDirection::CLOCKWISE'
      - tmc2209.configure:
          direction: !lambda return id(global_stepper_direction);

  # Schedule Enabled: master on/off for the daily schedule. When OFF, neither
  # schedule moves the cover. When ON, the "Sun Schedule" switch below selects
  # the mode: fixed "Open Time"/"Close Time" pickers (Sun Schedule OFF) or
  # sunrise/sunset with offsets (Sun Schedule ON). `optimistic` stores the
  # state locally; `restore_mode` brings it back after a reboot (default OFF so
  # a fresh unit never moves the cover unattended). Read live by the on_time
  # triggers and the sun-schedule interval via id(schedule_enabled).state.
  - platform: template
    name: "Schedule Enabled"
    web_server:
      sorting_weight: 1
      sorting_group_id: group_schedule
    id: schedule_enabled
    entity_category: CONFIG
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Sun Schedule: picks WHICH schedule the master "Schedule Enabled" runs.
  #   OFF -> fixed "Open Time"/"Close Time" pickers (default)
  #   ON  -> sunrise/sunset: open at sunrise + "Sun Open Offset" and close at
  #          sunset + "Sun Close Offset" (see those numbers and the sun-schedule
  #          interval). The fixed on_time triggers are suppressed while this is
  #          ON, so only one schedule is ever active at a time.
  # Master "Schedule Enabled" must still be ON for either schedule to run.
  # Resets the scheduler's cached daylight state on enable so it reconciles the
  # cover to the current sun position immediately rather than at the next event.
  - platform: template
    name: "Sun Schedule"
    web_server:
      sorting_weight: 2
      sorting_group_id: group_schedule
    id: sun_schedule_enabled
    entity_category: CONFIG
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: global_sun_last_desired
          value: "-1"


# -----------------------------------------------------------------------------
# Daily open/close schedule
# -----------------------------------------------------------------------------
# Two browser-editable time pickers (shown in the web UI and Home Assistant).
# Each fires once a day at the set local time via its on_time trigger; the
# action runs only when "Schedule Enabled" is on, and is skipped while HOMING
# (global_state == 3) so a scheduled move can't interrupt sensorless homing.
# Times persist across reboots (restore_value). Local time depends on the
# Timezone set below.
datetime:
  - platform: template
    name: "Open Time"
    web_server:
      sorting_weight: 3
      sorting_group_id: group_schedule
    id: open_time
    type: time
    entity_category: CONFIG
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    on_time:
      - if:
          condition:
            lambda: 'return id(schedule_enabled).state && !id(sun_schedule_enabled).state && id(global_state) != 3;'
          then:
            - logger.log: "Schedule: opening cover"
            - cover.open: ropener_cover

  - platform: template
    name: "Close Time"
    web_server:
      sorting_weight: 4
      sorting_group_id: group_schedule
    id: close_time
    type: time
    entity_category: CONFIG
    optimistic: true
    restore_value: true
    initial_value: "21:00:00"
    on_time:
      - if:
          condition:
            lambda: 'return id(schedule_enabled).state && !id(sun_schedule_enabled).state && id(global_state) != 3;'
          then:
            - logger.log: "Schedule: closing cover"
            - cover.close: ropener_cover

# -----------------------------------------------------------------------------
# Timezone (browser-editable)
# -----------------------------------------------------------------------------
# POSIX TZ string for the schedule's local time, editable in the web UI / HA
# and persisted across reboots. POSIX TZ format (note the sign is inverted vs.
# UTC offset), e.g.:
#   "UTC0"                          UTC (default)
#   "EST5EDT,M3.2.0,M11.1.0"        US Eastern with DST
#   "PST8PDT,M3.2.0,M11.1.0"        US Pacific with DST
#   "CET-1CEST,M3.5.0,M10.5.0/3"    Central Europe with DST
# Changing it calls set_timezone() immediately; on_boot re-applies the saved
# value (see esphome.on_boot). Find your zone's POSIX string in the IANA tz DB.
text:
  - platform: template
    name: "Timezone"
    web_server:
      sorting_weight: 9
      sorting_group_id: group_schedule
    id: tz_text
    entity_category: CONFIG
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "UTC0"
    min_length: 0
    max_length: 64
    set_action:
      - lambda: 'id(sntp_time)->set_timezone(x);'


# -----------------------------------------------------------------------------
# Tunable number entities
# -----------------------------------------------------------------------------
# Each entity below is bound to a global and pushes its value into the driver
# whenever the user changes it from Home Assistant. The `lambda` reads the
# value back live (every `update_interval`) so the HA UI reflects the actual
# state, not just the last value we wrote.
number:
  # Travel distance in centimeters — the single source of truth. Updating it
  # runs `recompute_distance`, which refreshes the derived global_distance_steps
  # cache so the cover entity remaps its 0..1 position range to the new step
  # count.
  #   distance_steps = (cm / gear_distance_cm) * steps_per_revolution
  - platform: template
    name: "Centimeters"
    web_server:
      sorting_weight: 1
      sorting_group_id: group_setup
    step: 1
    min_value: 1
    max_value: 9000
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_distance_cm);
    update_interval: 1s
    set_action:
      then:
        - globals.set:
            id: global_distance_cm
            value: !lambda "return x;"
        - script.execute: recompute_distance

  # Stepper acceleration (steps/s^2). Higher = snappier, but more chance of
  # missed steps and audible noise.
  - platform: template
    name: "Acceleration"
    web_server:
      sorting_weight: 2
      sorting_group_id: group_motion
    step: 100
    min_value: 100
    max_value: 10000
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_acceleration);
    update_interval: 1s
    set_action:
      then:
        - globals.set:
            id: global_acceleration
            value: !lambda "return x;"
        - stepper.set_acceleration:
            id: driver
            acceleration: !lambda "return id(global_acceleration);"

  # Cruise speed (steps/s). Hard-capped by the stepper's max_speed (2000).
  - platform: template
    name: "Speed"
    web_server:
      sorting_weight: 1
      sorting_group_id: group_motion
    step: 100
    min_value: 100
    max_value: 10000
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_speed);
    update_interval: 1s
    set_action:
      then:
        - globals.set:
            id: global_speed
            value: !lambda "return x;"
        - stepper.set_speed:
            id: driver
            speed: !lambda "return id(global_speed);"

  # IRUN — TMC2209 run-current setting (1..31). Reads back the live IRUN
  # field, not the cached global, so any external change is reflected.
  - platform: template
    name: "IRUN value"
    web_server:
      sorting_weight: 1
      sorting_group_id: group_stallguard
    step: 1
    min_value: 1
    max_value: 31
    mode: BOX
    entity_category: CONFIG
    lambda: return id(driver)->read_field(IRUN_FIELD);
    update_interval: 30s   # config value read over UART; poll slowly to limit register traffic
    set_action:
      then:
        - globals.set:
            id: global_irun
            value: !lambda "return x;"
        - tmc2209.currents:
            irun: !lambda "return id(global_irun);"

  # TCOOLTHRS — TSTEP threshold below which CoolStep / StallGuard are valid
  # (motor must be moving at least this fast). 20 bits, 0..1,048,575.
  - platform: template
    name: "TCOOLTHRS value"
    web_server:
      sorting_weight: 3
      sorting_group_id: group_stallguard
    step: 1
    min_value: 0
    max_value: 1048575
    mode: BOX
    entity_category: CONFIG
    lambda: return id(driver)->read_register(TCOOLTHRS);
    update_interval: 30s   # config value read over UART; poll slowly to limit register traffic
    set_action:
      then:
        - globals.set:
            id: global_tcoolthrs
            value: !lambda "return x;"
        - lambda: id(driver)->write_register(TCOOLTHRS, x);

  # SGTHRS — StallGuard sensitivity (0..255). The driver flags a stall when
  # SG_RESULT < 2*SGTHRS while TSTEP < TCOOLTHRS. Tune by watching the
  # SG_RESULT sensor while moving.
  - platform: template
    name: "SGTHRS value"
    web_server:
      sorting_weight: 2
      sorting_group_id: group_stallguard
    step: 1
    min_value: 0
    max_value: 255
    mode: BOX
    entity_category: CONFIG
    lambda: return id(driver)->read_register(SGTHRS);
    update_interval: 30s   # config value read over UART; poll slowly to limit register traffic
    set_action:
      then:
        - globals.set:
            id: global_sgthrs
            value: !lambda "return x;"
        - lambda: id(driver)->write_register(SGTHRS, x);

  # ---- Sun-schedule location & offsets ----------------------------------------
  # Latitude / Longitude in decimal degrees (north & east positive). Used only
  # by the sun schedule. Pushed into the sun component on change (and on boot);
  # changing either also resets the scheduler so it re-evaluates immediately.
  # Set these to your location for sunrise/sunset to be accurate.
  - platform: template
    name: "Latitude"
    web_server:
      sorting_weight: 7
      sorting_group_id: group_schedule
    step: 0.0001
    min_value: -90
    max_value: 90
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_latitude);
    update_interval: 30s
    set_action:
      then:
        - globals.set:
            id: global_latitude
            value: !lambda "return x;"
        - lambda: id(sun_sun)->set_latitude(x);
        - globals.set:
            id: global_sun_last_desired
            value: "-1"

  - platform: template
    name: "Longitude"
    web_server:
      sorting_weight: 8
      sorting_group_id: group_schedule
    step: 0.0001
    min_value: -180
    max_value: 180
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_longitude);
    update_interval: 30s
    set_action:
      then:
        - globals.set:
            id: global_longitude
            value: !lambda "return x;"
        - lambda: id(sun_sun)->set_longitude(x);
        - globals.set:
            id: global_sun_last_desired
            value: "-1"

  # Minute offsets for the sun schedule. Open fires at sunrise + open offset,
  # close at sunset + close offset. Negative = before the event (e.g. set the
  # close offset to -30 to close 30 minutes before sunset).
  - platform: template
    name: "Sun Open Offset"
    web_server:
      sorting_weight: 5
      sorting_group_id: group_schedule
    unit_of_measurement: "min"
    step: 1
    min_value: -180
    max_value: 180
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_sun_open_offset);
    update_interval: 30s
    set_action:
      then:
        - globals.set:
            id: global_sun_open_offset
            value: !lambda "return x;"
        - globals.set:
            id: global_sun_last_desired
            value: "-1"

  - platform: template
    name: "Sun Close Offset"
    web_server:
      sorting_weight: 6
      sorting_group_id: group_schedule
    unit_of_measurement: "min"
    step: 1
    min_value: -180
    max_value: 180
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_sun_close_offset);
    update_interval: 30s
    set_action:
      then:
        - globals.set:
            id: global_sun_close_offset
            value: !lambda "return x;"
        - globals.set:
            id: global_sun_last_desired
            value: "-1"

# -----------------------------------------------------------------------------
# State exposure (HA)
# -----------------------------------------------------------------------------
# Mirrors `global_state` to Home Assistant as a string. Polled rather than
# event-driven because state transitions happen in many places; one poll is
# simpler than wiring publish() into every transition site.
text_sensor:
  - platform: template
    name: "State"
    web_server:
      sorting_weight: 2
      sorting_group_id: group_control
    id: cover_state
    update_interval: 500ms
    lambda: |-
      switch (id(global_state)) {
        case 1: return {"OPENING"};
        case 2: return {"CLOSING"};
        case 3: return {"HOMING"};
        default: return {"IDLE"};
      }

  # Firmware version string, shown in the Diagnostics group of the web UI and in
  # Home Assistant device info. Static value published once from esphome.on_boot;
  # `update_interval: never` so it isn't re-polled.
  - platform: template
    name: "Firmware Version"
    id: firmware_version_text
    icon: "mdi:chip"
    entity_category: DIAGNOSTIC
    web_server:
      sorting_weight: 4
      sorting_group_id: group_diagnostics
    update_interval: never

# -----------------------------------------------------------------------------
# Motion-completion poll
# -----------------------------------------------------------------------------
# The stepper has no "target reached" event, so we poll: if we're in
# OPENING/CLOSING and current_position has caught up to target_position,
# flip back to IDLE and tell the cover entity. HOMING is intentionally
# excluded — its target (-100000) is a sentinel that's never reached;
# HOMING ends via on_stall or an either-button cancel.
interval:
  - interval: 200ms
    then:
      - globals.set:                       # persist position every tick (survives reboots)
          id: global_current_position
          value: !lambda "return id(driver)->current_position;"
      - if:
          condition:
            lambda: |-
              int s = id(global_state);
              return (s == 1 || s == 2) &&
                     id(driver)->current_position == id(driver)->target_position;
          then:
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE
            # Hold-to-run targets the configured ends (0 % / 100 %), so reaching
            # the target here IS the limit: drop the hold flags so a still-held
            # button does nothing more (it cannot drive past the end). The motor
            # is already stopped at the target by the stepper itself.
            - globals.set:
                id: b1_hold_active
                value: "false"
            - globals.set:
                id: b2_hold_active
                value: "false"

  # ---------------------------------------------------------------------------
  # Sun schedule poll
  # ---------------------------------------------------------------------------
  # When the master "Schedule Enabled" and "Sun Schedule" are both on, drive the
  # cover to match daylight: open during the day, closed at night, using local
  # sunrise/sunset (from the sun component) plus the minute offsets. We compare
  # the desired daylight state to the last one we acted on and only issue a move
  # on a transition — so it fires once at sunrise and once at sunset, reconciles
  # to the right state on boot, and never repeatedly fights manual control.
  # Skipped while HOMING. A 60 s tick is plenty for minute-resolution events.
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(schedule_enabled).state && id(sun_schedule_enabled).state && id(global_state) != 3;'
          then:
            - lambda: |-
                auto now = id(sntp_time)->now();
                if (!now.is_valid())
                  return;                                   // clock not synced yet
                auto sr = id(sun_sun)->sunrise(-0.833);     // standard sunrise/sunset elevation
                auto ss = id(sun_sun)->sunset(-0.833);
                if (!sr.has_value() || !ss.has_value())
                  return;                                   // no event today (polar day/night) or no location
                int now_min   = now.hour * 60 + now.minute;
                int open_min  = sr->hour * 60 + sr->minute + id(global_sun_open_offset);
                int close_min = ss->hour * 60 + ss->minute + id(global_sun_close_offset);
                int desired = (now_min >= open_min && now_min < close_min) ? 1 : 0;
                if (desired == id(global_sun_last_desired))
                  return;                                   // already in the right state
                id(global_sun_last_desired) = desired;
                ESP_LOGI("sun_schedule", "%s cover (now %02d:%02d, open %02d:%02d, close %02d:%02d)",
                         desired ? "opening" : "closing",
                         now.hour, now.minute,
                         (open_min / 60) % 24, ((open_min % 60) + 60) % 60,
                         (close_min / 60) % 24, ((close_min % 60) + 60) % 60);
                auto call = id(ropener_cover)->make_call();
                if (desired == 1)
                  call.set_command_open();
                else
                  call.set_command_close();
                call.perform();

# -----------------------------------------------------------------------------
# Diagnostic sensors (live TMC2209 register readouts)
# -----------------------------------------------------------------------------
# Useful for tuning StallGuard thresholds: drive the motor under expected
# load, watch SG_RESULT settle in HA, then set SGTHRS to ~half of that.
sensor:
  # TSTEP — measured time between step pulses. Smaller value = faster motion.
  # StallGuard is only active when TSTEP < TCOOLTHRS.
  - platform: template
    name: "TSTEP Sensor"
    web_server:
      sorting_weight: 5
      sorting_group_id: group_stallguard
    lambda: return id(driver)->read_register(TSTEP);
    update_interval: 5s
    entity_category: DIAGNOSTIC

  # SG_RESULT — StallGuard load reading. Drops as load increases; a stall is
  # signalled when SG_RESULT < 2*SGTHRS.
  - platform: template
    name: "SG_RESULT Sensor"
    web_server:
      sorting_weight: 4
      sorting_group_id: group_stallguard
    lambda: return id(driver)->read_register(SG_RESULT);
    update_interval: 1s
    entity_category: DIAGNOSTIC
