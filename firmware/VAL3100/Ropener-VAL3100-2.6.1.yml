# =============================================================================
# Ropener — VAL3100 (ESP32-C6)
# =============================================================================
# Thin per-board wrapper. It sets this board's chip variant, GPIO pin map, and
# OTA asset name as substitutions, then pulls in the shared, board-independent
# core. ALL device behaviour lives in ../common/ropener-core.yaml — edit that
# file to change behaviour for every board; edit this file only for VAL3100
# (ESP32-C6) hardware specifics.
#
# GPIO map (ESP32-C6 -> TMC2209 / buttons):
#   GPIO0 : UART TX  -> TMC2209 PDN_UART
#   GPIO1 : UART RX  <- TMC2209 PDN_UART
#   GPIO3 : Button 1  (close / home)
#   GPIO4 : Button 3  (Wi-Fi reset)
#   GPIO5 : ENN    (TMC2209 enable, active-low)
#   GPIO6 : DIAG   (StallGuard / fault -> on_stall)
#   GPIO7 : INDEX  (step-counter, informational)
#   GPIO19: Button 2  (open)
#   GPIO23: Status LED (device health indicator, active-high)
# =============================================================================
substitutions:
  board_variant: "esp32c6"
  board_id: "VAL3100 (ESP32-C6)"
  ota_asset: "Ropener-VAL3100"
  pin_uart_tx: "0"
  pin_uart_rx: "1"
  pin_enn: "5"
  pin_index: "7"
  pin_diag: "6"
  pin_btn1: "3"
  pin_btn2: "19"
  pin_btn_wifi: "4"

packages:
  core: !include ../common/ropener-core.yaml

# -----------------------------------------------------------------------------
# Status LED (VAL3100 / ESP32-C6 only)
# -----------------------------------------------------------------------------
# Onboard LED on GPIO23. ESPHome's `status_led` reflects device health with no
# custom logic:
#   off        - connected and healthy
#   slow blink - warning (Wi-Fi / API not connected, or in setup / AP mode)
#   fast blink - error
# Assumes the LED is active-high (lit when GPIO23 is driven high). If it's wired
# active-low (lit when the pin is low), set `inverted: true` under `pin:`.
# (The VAL3000 / ESP32-C3 board has no status LED, so this block is here rather
# than in the shared core.)
light:
  - platform: status_led
    name: "Status LED"
    id: status_led_light
    web_server:
      sorting_weight: 5
      sorting_group_id: group_diagnostics
    pin:
      number: GPIO23
      inverted: false
