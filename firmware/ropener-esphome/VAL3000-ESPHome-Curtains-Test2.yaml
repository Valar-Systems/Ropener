# This example uses a custom TMC2209 component to control the PD Stepper
# It uses the encoder to get the current blind position so it will not lose home if blind is manually moved

# If the motor stalls it stops the motor and sets this as the new home/OPEN position

# The "Home" button tries to move the blind up 120% of the set length and once a stall is detected it set this as the new home position (you may need to tune the stall theshold for you setup)
# This can be enabled at boot by un-commenting line 79.

# The stall feature can be disabled by commenting out line 135 & 136

# For MK7 drive gear:
#      revolutions = (float)maximum_motor_position / 100;  // 100 pulses per revolution. This gives us the number of revolutions
#      MAX_LIFT = (float)revolutions * 3.7699f;            // The curtain will move 3.7699 cm per revolution

external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [tmc2209_hub, tmc2209, stepper]

substitutions:
  closed_pos: "30000" # full blinds length (in pulse counts) // 100 counts per revolution // CHANGE TO SUIT YOUR SETUP

globals:
  - id: home_pos
    type: int32_t
    restore_value: no
    initial_value: "0"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

logger:

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

esphome:
  name: ropener
  platformio_options:
    board_build.flash_mode: dio
    upload_speed: 921600
  on_boot:
    - tmc2209.configure:
        microsteps: 8
        interpolation: true
    - tmc2209.stallguard:
        threshold: 50
    - tmc2209.currents:
        standstill_mode: freewheeling
        irun: 16
        ihold: 0
        tpowerdown: 0
        iholddelay: 0

#    - delay: 0.5s
#    - lambda: id(home_pos) = id(encoder)->get_state();  # Set the home (open) position to power on position
    # - button.press: home

uart:
  tx_pin: 6
  rx_pin: 5
  baud_rate: 712000

output:

stepper:
  - platform: tmc2209
    id: driver
    max_speed: 800 steps/s
    acceleration: 1500 steps/s^2
    deceleration: 1500 steps/s^2
    rsense: 110 mOhm
    vsense: False
    enn_pin: 8
    diag_pin: 1
    index_pin: 0
    # step_pin: 5
    # dir_pin: 6
    on_stall:
      - logger.log: "Motor stalled!"
      - stepper.stop: motor #disables the motor on a stallGuard event
#     - lambda: id(home_pos) = id(encoder)->get_state();  #This set sets the new home position to the stalled position
      - cover.template.publish:
          id: ropener
          state: OPEN

button:
  - platform: restart
    name: Restart

  - platform: template
    name: Home
    id: home
    on_press:
      - stepper.set_target:
          id: motor
          # 1.2 * encoder_closed_pos makes it travel 120% of the distance to ensure home is hit and a motor stall forces the new home position.
          # The negative sign ensures it moves toward the "Home/Open" direction.
          target: !lambda return -1.2 * ${closed_pos};

  - platform: template
    name: Stop
    on_press:
      - stepper.stop: motor

binary_sensor:
 - platform: gpio
   name: Button 1
   pin:
     number: 4
     mode: INPUT
     inverted: true
   id: btn1
   filters:
     - delayed_on: 10ms
   on_press:
     - logger.log: "Button pressed"
     - cover.open: ropener

 - platform: gpio
   name: Button 2
   id: btn2
   pin:
     number: 3
     mode: INPUT
     inverted: true
   filters:
     - delayed_on: 10ms
   on_press:
     - logger.log: "Button pressed"
     - cover.close: ropener

 - platform: gpio
   name: Limit Switch 1
   id: limit_switch_1
   pin:
     number: 10
     mode: INPUT
     inverted: true
   filters:
     - delayed_on: 10ms
   on_press:
     - cover.stop: ropener

 - platform: gpio
   name: Limit Switch 2
   id: limit_switch_2
   pin:
     number: 2
     mode: INPUT
     inverted: true
   filters:
     - delayed_on: 10ms
   on_press:
     - cover.stop: ropener

cover:
  - platform: template
    id: ropener
    name: "Ropener"
    has_position: true
    assumed_state: false
    # internal: true
#    lambda: "return 1.0 - ((id(encoder)->get_state()-id(sensored_home_pos)));"
    stop_action:
      - stepper.stop: driver
    open_action:
      - stepper.report_position:
          id: motor
          position: !lambda return (1.0-id(ropener)->position);
      - stepper.set_target:
          id: motor
          target: 0
    close_action:
      - stepper.report_position:
          id: motor
          position: !lambda return (1.0-id(ropener)->position);
      - stepper.set_target:
          id: motor
          target: !lambda return (1.0-id(ropener)->position);
    position_action:
      - stepper.report_position:
          id: motor
          position: !lambda return (1.0-id(ropener)->position);
      - stepper.set_target:
          id: motor
          target: !lambda return (1.0-pos);