external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [tmc2209_hub, tmc2209, stepper]

# For MK7 drive gear:
#      revolutions = (float)maximum_motor_position / 100;  // 100 pulses per revolution. This gives us the number of revolutions
#      MAX_LIFT = (float)revolutions * 3.7699f;            // The curtain will move 3.7699 cm per revolution

# Ideally, need an easy way to convert inches into steps

substitutions:
  closed_pos: "8000" # full blinds length (in pulse counts) // 100 counts per revolution? // CHANGE TO SUIT YOUR SETUP

api:

ota:
  - platform: esphome

logger:

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esphome:
  name: ropener
  on_boot:
    - tmc2209.configure:
        microsteps: 8
        interpolation: true
    - tmc2209.stallguard:
        threshold: 50
    - tmc2209.currents:
        standstill_mode: freewheeling
        irun: 16 # 0-31. 31 = 2A current
        ihold: 0
        tpowerdown: 0
        iholddelay: 0

uart:
  tx_pin: 6
  rx_pin: 5
  baud_rate: 500000

stepper:
  - platform: tmc2209
    id: driver
    max_speed: 900 steps/s
    acceleration: 1500 steps/s^2
    deceleration: 500 steps/s^2
    config_dump_include_registers: true
    rsense: 110 mOhm
    vsense: False
    enn_pin: 8
    index_pin: 0
    diag_pin: 1
    on_stall:
      - logger.log: "Motor stalled!"
      - stepper.stop: driver

binary_sensor:
 - platform: gpio
   name: Button 1
   id: btn1
   pin:
     number: 4
     mode: INPUT
     inverted: true
   filters:
     - delayed_on: 10ms
   on_press:
     - cover.close: ropener
#   on_double_click:
#     - !lambda id(ropener).position = 0;

 - platform: gpio
   name: Button 2
   id: btn2
   pin:
     number: 3
     mode: INPUT
     inverted: true
   filters:
     - delayed_on: 10ms
   on_press:
     - cover.open: ropener

cover:
  - platform: template
    id: ropener
    name: "Ropener"
    has_position: true
    assumed_state: false
    # internal: true
#    lambda: "return 1.0 - ((id(encoder)->get_state()-id(sensored_home_pos)));"
    stop_action:
      - stepper.stop: driver
    open_action:
      - stepper.report_position:
          id: driver
          position: !lambda return (1.0 - id(ropener)->position) * ${closed_pos};
      - stepper.set_target:
          id: driver
          target: 0
    close_action:
      - stepper.report_position:
          id: driver
          position: !lambda return (1.0-id(ropener)->position) * ${closed_pos};
      - stepper.set_target:
          id: driver
          target: !lambda return ${closed_pos};
    position_action:
      - stepper.report_position:
          id: driver
          position: !lambda return (1.0-id(ropener)->position) * ${closed_pos};
      - stepper.set_target:
          id: driver
          target: !lambda return (1.0-pos) * ${closed_pos};

