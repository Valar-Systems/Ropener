external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [tmc2209_hub, tmc2209, stepper]

substitutions:
  max_distance_cm: "80" # full blinds length (in centimeters) // CHANGE TO SUIT YOUR SETUP
  stepper_direction: "cw" # change to "cw" or "ccw" to change direction

  gear_distance_cm: "3.7699" # Use for MK7 drive gear // The curtain will move 3.7699 cm per revolution
  steps_per_revolution: "1600"
  max_distance_revs: "float(${max_distance_cm})/${gear_distance_cm}"
  max_distance_steps: "${max_distance_revs}*${steps_per_revolution}" # converts cm to steps. Use this in remaining code

api:

ota:
  - platform: esphome

logger:

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esphome:
  name: ropener
  on_boot:
    - tmc2209.configure:
        direction: ${stepper_direction}
        microsteps: 8
        interpolation: true
    - tmc2209.stallguard:
        threshold: 50
    - tmc2209.currents:
        standstill_mode: freewheeling
        irun: 31 # 0-31. 31 = 2A current
        ihold: 0
        tpowerdown: 0
        iholddelay: 0

uart:
  tx_pin: 6
  rx_pin: 5
  baud_rate: 500000

stepper:
  - platform: tmc2209
    id: driver
    max_speed: 1600 steps/s
    acceleration: 2000 steps/s^2
    deceleration: 1000 steps/s^2
    config_dump_include_registers: true
    rsense: 100 mOhm
    vsense: False
    enn_pin: 8
    index_pin: 0
    diag_pin: 1
    on_stall:
      - stepper.stop: driver
      - stepper.report_position:
          id: driver
          position: !lambda return ${max_distance_steps};
      - logger.log: "Homed cover"

binary_sensor:
 - platform: gpio
   name: Button 1
   id: btn1
   pin:
     number: 4
     mode: INPUT
     inverted: true
   filters:
     - delayed_on: 10ms
   on_release: #
     then:
       - cover.close: ropener_cover
   on_click: # Set the current position to zero. Also needs to update the cover
      min_length: 3000ms
      max_length: 10000ms
      then:
        - stepper.report_position:
            id: driver
            position: 0
        - logger.log: "Homed cover"

 - platform: gpio
   name: Button 2
   id: btn2
   pin:
     number: 3
     mode: INPUT
     inverted: true
   filters:
     - delayed_on: 10ms
   on_press:
     - cover.open: ropener_cover

cover:
  - platform: template
    id: ropener_cover
    name: Ropener
    has_position: true
    assumed_state: false
    lambda: "return id(driver)->current_position / ${max_distance_steps};"
    stop_action:
      - stepper.stop: driver
    open_action:
      - stepper.set_target:
          id: driver
          target: !lambda return ${max_distance_steps};
    close_action:
      - stepper.set_target:
          id: driver
          target: 0
    position_action:
      - stepper.set_target:
          id: driver
          target: !lambda return (1.0-pos) * ${max_distance_steps};
          
button:
  - platform: template
    name: Set Zero Position
    on_press:
      - stepper.report_position:
          id: driver
          position: 0

