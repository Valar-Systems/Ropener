# =============================================================================
# Ropener — ESPHome firmware (Matter variant)
# Version: 2.2.0
# =============================================================================
#
# Matter-enabled build of the Ropener firmware. Exposes the curtain as a
# Matter Window Covering device, controllable from Apple Home, Google Home,
# Amazon Alexa, Samsung SmartThings, and any other Matter-certified ecosystem
# — without requiring Home Assistant.
#
# Differences from ESPHome.yml (standard build):
#   - Adds    : matter: (Window Covering device type)
#   - Removes : web_server: (memory — Matter + Wi-Fi + BLE is already heavy)
#   - Removes : esp32_improv_ble: (not supported on ESP32-C3/esp-idf; Matter uses BLE itself anyway)
#
# All motor control logic, physical buttons, StallGuard homing, and tunable
# parameters are identical to the standard build.
#
# -----------------------------------------------------------------------------
# Commissioning
# -----------------------------------------------------------------------------
#   1. Flash this firmware via USB (see README).
#   2. Open your Matter controller app (Home, Google Home, Alexa, etc.).
#   3. Add a new device — scan the QR code or enter the pairing code printed
#      in the serial log at boot (search for "Matter" in the log output).
#   4. The controller pairs over BLE and then switches to Wi-Fi for control.
#
# Note: Matter commissioning uses BLE. Once commissioned the BLE stack is
# released and the device runs over Wi-Fi only.
#
# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
#   MCU     : ESP32-C3 (esp32-c3-devkitm-1, esp-idf framework)
#   Driver  : TMC2209 stepper driver, single-wire UART control (PDN_UART)
#   Motor   : NEMA-17 stepper, 200 full steps/rev, 8x microstepping = 1600 steps/rev
#   Gearing : MK7 drive gear, ~3.7699 cm of rope per revolution
#
# -----------------------------------------------------------------------------
# GPIO wiring (ESP32-C3 -> TMC2209 / buttons)
# -----------------------------------------------------------------------------
#   GPIO0 : INDEX  (TMC2209 step-counter output, informational)
#   GPIO1 : DIAG   (TMC2209 StallGuard / diagnostic output -> on_stall)
#   GPIO3 : Button 2  (open),         active-low pushbutton to GND
#   GPIO4 : Button 1  (close / home), active-low pushbutton to GND
#   GPIO5 : UART RX  <- TMC2209 PDN_UART
#   GPIO6 : UART TX  -> TMC2209 PDN_UART
#   GPIO8 : ENN    (TMC2209 enable, active-low)
#
# -----------------------------------------------------------------------------
# Position / motion model
# -----------------------------------------------------------------------------
#   Steps are the canonical position unit. Cover position is derived live:
#
#       position = current_position / global_distance_steps      (0.0 .. 1.0)
#
#   where:
#       global_distance_steps = (distance_cm / gear_distance_cm) * steps_per_revolution
#
#   Defaults give a 30 cm travel window:
#       30 cm / 3.7699 cm/rev * 1600 steps/rev ≈ 12,732 steps
#
#   Position 0 = fully closed (rope home, located by StallGuard).
#   Position 1 = fully open   (target = global_distance_steps).
#
# -----------------------------------------------------------------------------
# Homing
# -----------------------------------------------------------------------------
#   The closed end is found by sensorless StallGuard: the motor drives toward
#   the closed direction until SG_RESULT drops below SGTHRS while the motor is
#   running below TCOOLTHRS, which fires DIAG and triggers the stepper's
#   on_stall handler. That handler stops the motor and zeroes the position.
#
#   Manual re-home (drives motor toward closed end until StallGuard fires):
#     - Long-press (3-10 s) Button 1, OR
#     - Press the "Start Homing" diagnostic button.
#   Homing can be cancelled by:
#     - Any press of Button 1 while HOMING, OR
#     - Pressing the "Start Homing" button again while HOMING.
#
# -----------------------------------------------------------------------------
# Buttons (physical, on the device)
# -----------------------------------------------------------------------------
#   Any press of either button while the cover is OPENING or CLOSING stops
#   the motor (and leaves the position where it is).
#
#   Button 1 (GPIO4):
#     - Short press (50 ms - 1 s)   : close cover    (or stop, or cancel HOMING)
#     - Long  press (3 s - 10 s)    : start homing   (or stop, or cancel HOMING)
#   Button 2 (GPIO3):
#     - Release                     : open cover     (or stop if moving)
#
# -----------------------------------------------------------------------------
# Required secrets (secrets.yaml)
# -----------------------------------------------------------------------------
#   wifi_ssid, wifi_password : Wi-Fi credentials
#
# If Wi-Fi credentials change, connect to the "Ropener Setup" hotspot and
# follow the captive portal to enter new credentials.
# =============================================================================

# External TMC2209 component family by @slimcdk. Provides UART register access,
# StallGuard configuration, and the tmc2209 stepper platform used below.
external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [tmc2209_hub, tmc2209, stepper]

# -----------------------------------------------------------------------------
# Persistent state
# -----------------------------------------------------------------------------
globals:
  - id: global_irun
    type: int
    restore_value: yes
    initial_value: '25'

  - id: global_speed
    type: int
    restore_value: yes
    initial_value: '1500'

  - id: global_acceleration
    type: int
    restore_value: yes
    initial_value: '1500'

  - id: global_tcoolthrs
    type: int
    restore_value: yes
    initial_value: '0'

  - id: global_sgthrs
    type: int
    restore_value: yes
    initial_value: '0'

  - id: global_distance_cm
    type: int
    restore_value: yes
    initial_value: '30'

  - id: global_distance_steps
    type: int
    restore_value: yes
    initial_value: '12732'

  - id: global_stepper_direction
    type: esphome::tmc2209::ShaftDirection
    restore_value: yes
    initial_value: 'esphome::tmc2209::ShaftDirection::CLOCKWISE'

  - id: global_distance_revolutions
    type: float
    restore_value: yes
    initial_value: '21.22'

  - id: global_state
    type: int
    restore_value: no
    initial_value: '0'

  - id: global_current_position
    type: int
    restore_value: yes
    initial_value: '0'

# -----------------------------------------------------------------------------
# Mechanical constants
# -----------------------------------------------------------------------------
substitutions:
  gear_distance_cm: "3.7699"
  steps_per_revolution: "1600"

# -----------------------------------------------------------------------------
# Native ESPHome API (optional — for Home Assistant alongside Matter)
# -----------------------------------------------------------------------------
api:

# Over-the-air firmware updates via the ESPHome platform.
ota:
  - platform: esphome

# UART logger. By default ESPHome logs one DEBUG line per entity publish, so
# the chatty `number` / `text_sensor` / `sensor` entities (which re-publish on
# every update_interval) flood the log even while idle. Keep the global level
# at DEBUG so device events still show (homing, Wi-Fi), but raise those three
# publish-heavy tags to INFO to hide their routine updates. The live values are
# still visible in the web UI / Home Assistant — only the log spam is
# suppressed. To watch SG_RESULT in the log while tuning StallGuard, set
# `sensor: DEBUG` here (or remove that line).
logger:
  logs:
    number: INFO
    text_sensor: INFO
    sensor: INFO

# -----------------------------------------------------------------------------
# Matter
# -----------------------------------------------------------------------------
# Exposes the cover entity as a Matter Window Covering device. ESPHome handles
# the Matter stack automatically; no additional entity configuration is needed.
# The pairing QR code and manual pairing code are printed to the serial log at
# boot — search for "Matter" in the output.
matter:

# -----------------------------------------------------------------------------
# Board / Wi-Fi
# -----------------------------------------------------------------------------
esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Credentials live in secrets.yaml. If the saved network is unreachable the
# device broadcasts a "Ropener Setup" hotspot — connect to it and the captive
# portal will let you enter new Wi-Fi credentials without a USB reflash.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Ropener Setup"

captive_portal:

# Improv over USB serial — lets web.esphome.io push Wi-Fi credentials without
# editing secrets.yaml. (esp32_improv_ble is omitted: Matter uses BLE itself.)
improv_serial:

# -----------------------------------------------------------------------------
# Device identity + boot-time motor configuration
# -----------------------------------------------------------------------------
esphome:
  name: ropener
  name_add_mac_suffix: true          # makes every unit unique, e.g. ropener-a1b2c3
  friendly_name: "Ropener Curtain"
  project:
    name: "valar-systems.ropener-matter"
    version: "2.2.0"
  on_boot:
    - tmc2209.configure:
        direction: !lambda return id(global_stepper_direction);
        microsteps: 8
        interpolation: true
        tcool_threshold: !lambda "return id(global_tcoolthrs);"
    - tmc2209.stallguard:
        threshold: !lambda "return id(global_sgthrs);"
    - tmc2209.currents:
        standstill_mode: freewheeling
        irun: !lambda "return id(global_irun);"
        ihold: 0
        tpowerdown: 0
        iholddelay: 0
    - stepper.set_speed:
        id: driver
        speed: !lambda "return id(global_speed);"
    - stepper.set_acceleration:
        id: driver
        acceleration: !lambda "return id(global_acceleration);"
    - stepper.report_position:
        id: driver
        position: !lambda "return id(global_current_position);"
    - stepper.set_target:
        id: driver
        target: !lambda "return id(global_current_position);"

# -----------------------------------------------------------------------------
# UART to TMC2209 (PDN_UART, single-wire)
# -----------------------------------------------------------------------------
uart:
  tx_pin: 6
  rx_pin: 5
  baud_rate: 500000

# -----------------------------------------------------------------------------
# Stepper driver
# -----------------------------------------------------------------------------
stepper:
  - platform: tmc2209
    id: driver
    max_speed: 2000 steps/s
    acceleration: 2000 steps/s^2
    deceleration: 3000 steps/s^2
    config_dump_include_registers: false
    rsense: 100 mOhm
    vsense: False
    enn_pin: 8
    index_pin: 0
    diag_pin: 1
    on_stall:
      - stepper.stop: driver
      - if:
          condition:
            lambda: 'return id(global_state) == 3;'
          then:
            - stepper.report_position:
                id: driver
                position: 0
            - stepper.set_target:
                id: driver
                target: 0
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE
            - logger.log: "Homed cover"
          else:
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE
            - logger.log: "Stall detected outside homing — motor stopped, position unchanged"

# -----------------------------------------------------------------------------
# Physical buttons
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    name: Button 1
    id: btn1
    pin:
      number: 4
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 10ms
    on_click:
      - min_length: 50ms
        max_length: 1000ms
        then:
          - if:
              condition:
                lambda: 'return id(global_state) == 3;'
              then:
                - stepper.stop: driver
                - stepper.report_position:
                    id: driver
                    position: 0
                - stepper.set_target:
                    id: driver
                    target: 0
                - globals.set:
                    id: global_state
                    value: "0"
                - cover.template.publish:
                    id: ropener_cover
                    current_operation: IDLE
                - logger.log: "Homing cancelled"
              else:
                - if:
                    condition:
                      lambda: 'return id(global_state) == 1 || id(global_state) == 2;'
                    then:
                      - cover.stop: ropener_cover
                    else:
                      - cover.close: ropener_cover
      - min_length: 3000ms
        max_length: 10000ms
        then:
          - if:
              condition:
                lambda: 'return id(global_state) == 3;'
              then:
                - stepper.stop: driver
                - stepper.report_position:
                    id: driver
                    position: 0
                - stepper.set_target:
                    id: driver
                    target: 0
                - globals.set:
                    id: global_state
                    value: "0"
                - cover.template.publish:
                    id: ropener_cover
                    current_operation: IDLE
                - logger.log: "Homing cancelled"
              else:
                - if:
                    condition:
                      lambda: 'return id(global_state) == 1 || id(global_state) == 2;'
                    then:
                      - cover.stop: ropener_cover
                    else:
                      - globals.set:
                          id: global_state
                          value: "3"
                      - cover.template.publish:
                          id: ropener_cover
                          current_operation: CLOSING
                      - stepper.report_position:
                          id: driver
                          position: 0
                      - stepper.set_target:
                          id: driver
                          target: -100000
                      - logger.log: "Starting homing"

  - platform: gpio
    name: Button 2
    id: btn2
    pin:
      number: 3
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 10ms
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(global_state) == 1 || id(global_state) == 2;'
            then:
              - cover.stop: ropener_cover
            else:
              - cover.open: ropener_cover

# -----------------------------------------------------------------------------
# Cover entity — exposed to Matter as a Window Covering device
# -----------------------------------------------------------------------------
cover:
  - platform: template
    id: ropener_cover
    name: Ropener
    has_position: true
    assumed_state: false
    lambda: "return float(id(driver)->current_position) / float(id(global_distance_steps));"
    stop_action:
      - stepper.stop: driver
      - globals.set:
          id: global_state
          value: "0"
      - cover.template.publish:
          id: ropener_cover
          current_operation: IDLE
    open_action:
      - globals.set:
          id: global_state
          value: "1"
      - cover.template.publish:
          id: ropener_cover
          current_operation: OPENING
      - stepper.set_target:
          id: driver
          target: !lambda return id(global_distance_steps);
    close_action:
      - globals.set:
          id: global_state
          value: "2"
      - cover.template.publish:
          id: ropener_cover
          current_operation: CLOSING
      - stepper.set_target:
          id: driver
          target: 0
    position_action:
      - if:
          condition:
            lambda: 'return (pos * id(global_distance_steps)) >= id(driver)->current_position;'
          then:
            - globals.set:
                id: global_state
                value: "1"
            - cover.template.publish:
                id: ropener_cover
                current_operation: OPENING
          else:
            - globals.set:
                id: global_state
                value: "2"
            - cover.template.publish:
                id: ropener_cover
                current_operation: CLOSING
      - stepper.set_target:
          id: driver
          target: !lambda return pos * id(global_distance_steps);

# -----------------------------------------------------------------------------
# Homing button
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: "Start-Stop Homing"
    entity_category: DIAGNOSTIC
    on_press:
      - if:
          condition:
            lambda: 'return id(global_state) == 3;'
          then:
            - stepper.stop: driver
            - stepper.report_position:
                id: driver
                position: 0
            - stepper.set_target:
                id: driver
                target: 0
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE
          else:
            - globals.set:
                id: global_state
                value: "3"
            - cover.template.publish:
                id: ropener_cover
                current_operation: CLOSING
            - stepper.report_position:
                id: driver
                position: 0
            - stepper.set_target:
                id: driver
                target: -100000

# -----------------------------------------------------------------------------
# Configuration switches
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: "Motor Direction"
    entity_category: CONFIG
    optimistic: true
    turn_on_action:
      - globals.set:
          id: global_stepper_direction
          value: 'esphome::tmc2209::ShaftDirection::COUNTERCLOCKWISE'
      - tmc2209.configure:
          direction: !lambda return id(global_stepper_direction);
    turn_off_action:
      - globals.set:
          id: global_stepper_direction
          value: 'esphome::tmc2209::ShaftDirection::CLOCKWISE'
      - tmc2209.configure:
          direction: !lambda return id(global_stepper_direction);

# -----------------------------------------------------------------------------
# Tunable number entities
# -----------------------------------------------------------------------------
number:
  - platform: template
    name: "Centimeters"
    step: 1
    min_value: 1
    max_value: 9000
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_distance_cm);
    update_interval: 1s
    set_action:
      then:
        - globals.set:
            id: global_distance_cm
            value: !lambda "return x;"
        - globals.set:
            id: global_distance_revolutions
            value: !lambda "return float(id(global_distance_cm))/${gear_distance_cm};"
        - globals.set:
            id: global_distance_steps
            value: !lambda "return id(global_distance_revolutions)*${steps_per_revolution};"

  - platform: template
    name: "Acceleration"
    step: 100
    min_value: 100
    max_value: 10000
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_acceleration);
    update_interval: 1s
    set_action:
      then:
        - globals.set:
            id: global_acceleration
            value: !lambda "return x;"
        - stepper.set_acceleration:
            id: driver
            acceleration: !lambda "return id(global_acceleration);"

  - platform: template
    name: "Speed"
    step: 100
    min_value: 100
    max_value: 10000
    mode: BOX
    entity_category: CONFIG
    lambda: return id(global_speed);
    update_interval: 1s
    set_action:
      then:
        - globals.set:
            id: global_speed
            value: !lambda "return x;"
        - stepper.set_speed:
            id: driver
            speed: !lambda "return id(global_speed);"

  - platform: template
    name: "IRUN value"
    step: 1
    min_value: 1
    max_value: 31
    mode: BOX
    entity_category: CONFIG
    lambda: return id(driver)->read_field(IRUN_FIELD);
    update_interval: 30s   # config value read over UART; poll slowly to limit register traffic
    set_action:
      then:
        - globals.set:
            id: global_irun
            value: !lambda "return x;"
        - tmc2209.currents:
            irun: !lambda "return id(global_irun);"

  - platform: template
    name: "TCOOLTHRS value"
    step: 1
    min_value: 0
    max_value: 1048575
    mode: BOX
    entity_category: CONFIG
    lambda: return id(driver)->read_register(TCOOLTHRS);
    update_interval: 30s   # config value read over UART; poll slowly to limit register traffic
    set_action:
      then:
        - globals.set:
            id: global_tcoolthrs
            value: !lambda "return x;"
        - lambda: id(driver)->write_register(TCOOLTHRS, x);

  - platform: template
    name: "SGTHRS value"
    step: 1
    min_value: 0
    max_value: 255
    mode: BOX
    entity_category: CONFIG
    lambda: return id(driver)->read_register(SGTHRS);
    update_interval: 30s   # config value read over UART; poll slowly to limit register traffic
    set_action:
      then:
        - globals.set:
            id: global_sgthrs
            value: !lambda "return x;"
        - lambda: id(driver)->write_register(SGTHRS, x);

# -----------------------------------------------------------------------------
# State text sensor
# -----------------------------------------------------------------------------
text_sensor:
  - platform: template
    name: "State"
    id: cover_state
    update_interval: 500ms
    lambda: |-
      switch (id(global_state)) {
        case 1: return {"OPENING"};
        case 2: return {"CLOSING"};
        case 3: return {"HOMING"};
        default: return {"IDLE"};
      }

# -----------------------------------------------------------------------------
# Motion-completion poll
# -----------------------------------------------------------------------------
interval:
  - interval: 200ms
    then:
      - globals.set:
          id: global_current_position
          value: !lambda "return id(driver)->current_position;"
      - if:
          condition:
            lambda: |-
              int s = id(global_state);
              return (s == 1 || s == 2) &&
                     id(driver)->current_position == id(driver)->target_position;
          then:
            - globals.set:
                id: global_state
                value: "0"
            - cover.template.publish:
                id: ropener_cover
                current_operation: IDLE

# -----------------------------------------------------------------------------
# Diagnostic sensors
# -----------------------------------------------------------------------------
sensor:
  - platform: template
    name: "TSTEP Sensor"
    lambda: return id(driver)->read_register(TSTEP);
    update_interval: 5s
    entity_category: DIAGNOSTIC

  - platform: template
    name: "SG_RESULT Sensor"
    lambda: return id(driver)->read_register(SG_RESULT);
    update_interval: 1s
    entity_category: DIAGNOSTIC
