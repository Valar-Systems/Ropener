# =============================================================================
# Ropener — VAL3000 (ESP32-C3)
# =============================================================================
# Thin per-board wrapper. It sets this board's chip variant, GPIO pin map, and
# OTA asset name as substitutions, then pulls in the shared, board-independent
# core. ALL device behaviour lives in ../common/ropener-core.yaml — edit that
# file to change behaviour for every board; edit this file only for VAL3000
# (ESP32-C3) hardware specifics.
#
# GPIO map (ESP32-C3 -> TMC2209 / buttons):
#   GPIO0 : INDEX  (step-counter, informational)
#   GPIO1 : DIAG   (StallGuard / fault -> on_stall)
#   GPIO3 : Button 2  (open)
#   GPIO4 : Button 1  (close / home)
#   GPIO5 : UART RX  <- TMC2209 PDN_UART
#   GPIO6 : UART TX  -> TMC2209 PDN_UART
#   GPIO7 : Button 3  (Wi-Fi reset)
#   GPIO8 : ENN    (TMC2209 enable, active-low)
#   (this board has no status LED)
# =============================================================================
substitutions:
  board_variant: "esp32c3"
  board_id: "VAL3000 (ESP32-C3)"
  ota_asset: "Ropener-VAL3000"
  pin_uart_tx: "6"
  pin_uart_rx: "5"
  pin_enn: "8"
  pin_index: "0"
  pin_diag: "1"
  pin_btn1: "4"
  pin_btn2: "3"
  pin_btn_wifi: "7"

packages:
  core: !include ../common/ropener-core.yaml
