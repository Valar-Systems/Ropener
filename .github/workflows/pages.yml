name: Deploy flasher to GitHub Pages

# Publishes ONLY the flash/ folder (the ESP Web Tools install page + manifest)
# as the site root, so the flasher is fast to deploy and the whole 90 MB repo
# isn't packaged into the Pages artifact.
on:
  push:
    branches: [main]
    paths:
      - "flash/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flash
      - id: deployment
        uses: actions/deploy-pages@v4
